<style>
  :root {
    --primary-color: #2D7A5F;
    --primary-dark: #1E5340;
    --primary-light: #E8F4F0;
    --accent-color: #E07A5F;
    --text-dark: #2B2D42;
    --text-light: #6C757D;
    --bg-light: #F8F9FA;
    --bg-white: #FFFFFF;
    --border-color: #E9ECEF;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-dark);
    background-color: var(--bg-light);
    line-height: 1.5;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .navbar {
    background-color: var(--bg-white);
    border-bottom: 1px solid var(--border-color);
    padding: 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .navbar .container { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
  .nav-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; color: var(--primary-color); white-space: nowrap; }
  .nav-brand .logo { width: 32px; height: 32px; }
  .nav-slider { display: flex; align-items: center; min-width: 0; }
  .nav-scroll-control { display: none; }
  .nav-links { display: flex; align-items: center; gap: 24px; }
  .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 500; white-space: nowrap; }
  .nav-links a:hover { color: var(--primary-color); }
  .btn-primary {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .btn-primary:hover { background-color: var(--primary-dark); }
  .btn-secondary {
    background-color: transparent;
    color: var(--text-dark);
    border: 1px solid var(--border-color);
    padding: 10px 20px;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
  }
  .btn-secondary:hover { background-color: var(--bg-light); }
  .btn-back {
    background: none; border: none; color: var(--primary-color); font-weight: 600; cursor: pointer; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-gps {
    background-color: var(--primary-light);
    color: var(--primary-color);
    border: 1px solid var(--primary-color);
    padding: 8px 16px;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .btn-gps:hover { background-color: #D4ECE3; }
  .page { display: none; padding: 40px 0; }
  .page.active { display: block; }
  .hero { background-color: var(--bg-white); border-bottom: 1px solid var(--border-color); padding: 60px 0; }
  .hero-content { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .hero-label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--primary-color); margin-bottom: 16px; }
  .hero-text h1 { font-size: 48px; line-height: 1.1; margin-bottom: 24px; font-weight: 400; }
  .hero-text h1 strong { font-weight: 800; color: var(--primary-color); }
  .hero-text .hero-desc { font-size: 18px; color: var(--text-light); }
  .hero-image img { width: 100%; height: auto; border-radius: var(--radius); }
  .section-gap { padding: 60px 0; background-color: var(--bg-light); }
  .gap-content { display: grid; grid-template-columns: 1fr 2fr; gap: 48px; }
  .section-label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-light); margin-bottom: 12px; }
  .section-dark { background-color: var(--primary-dark); color: white; padding: 80px 0; }
  .section-label-light { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #A3D9C9; margin-bottom: 16px; }
  .section-title-light { font-size: 36px; font-weight: 400; line-height: 1.2; margin-bottom: 48px; }
  .steps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .step-card { background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 24px; border-radius: var(--radius); }
  .step-num { font-size: 14px; font-weight: 700; color: #A3D9C9; margin-bottom: 16px; }
  .step-card h4 { font-size: 18px; margin-bottom: 12px; }
  .step-card p { font-size: 14px; color: #D1E7E0; }
  .section-search { background-color: var(--bg-white); padding: 40px 0; }
  .search-bar-container { display: flex; gap: 12px; margin: 24px 0 40px 0; }
  .search-input { flex: 1; padding: 12px 16px; font-size: 16px; border: 1px solid var(--border-color); border-radius: var(--radius); outline: none; }
  .search-input:focus { border-color: var(--primary-color); }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 40px; padding-top: 40px; border-top: 1px solid var(--border-color); }
  .stat-card { text-align: center; }
  .stat-number { font-size: 36px; font-weight: 700; color: var(--primary-color); }
  .stat-label { font-size: 14px; color: var(--text-light); margin-top: 4px; }
  .form-container { background-color: var(--bg-white); border-radius: var(--radius); border: 1px solid var(--border-color); padding: 40px; max-width: 800px; margin: 0 auto; box-shadow: var(--shadow); }
  .form-section { margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--border-color); }
  .admin-access-page { min-height: calc(100vh - 82px); display: grid; place-items: center; padding: 56px 24px; background: linear-gradient(135deg, var(--bg-light) 0%, #FFFFFF 58%, var(--primary-light) 100%); }
  .admin-login-panel { width: min(100%, 430px); background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 12px; padding: 36px; box-shadow: 0 16px 40px rgba(30, 58, 50, 0.12); }
  .admin-login-mark { width: 44px; height: 44px; display: grid; place-items: center; margin-bottom: 24px; border-radius: 10px; background: var(--primary-dark); color: #FFFFFF; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; }
  .admin-login-panel h2 { color: var(--primary-dark); font-size: 30px; margin-bottom: 8px; }
  .admin-login-copy { color: var(--text-light); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
  .admin-login-form .form-group { margin-bottom: 18px; }
  .admin-login-submit { width: 100%; margin-top: 4px; }
  .form-section:last-child { border-bottom: none; }
  .form-section-title { font-size: 20px; color: var(--primary-color); margin-bottom: 8px; font-weight: 600; }
  .form-section-desc { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .required-star { color: var(--accent-color); }
  .optional-text { font-weight: 400; color: var(--text-light); font-size: 12px; }
  .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius); font-size: 15px; outline: none; }
  .form-control:focus { border-color: var(--primary-color); }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .checkbox-group label { font-weight: 400; display: flex; align-items: center; gap: 6px; cursor: pointer; background-color: var(--bg-light); padding: 8px 12px; border-radius: 20px; font-size: 14px; }
  .file-list { margin-top: 12px; font-size: 14px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 16px; margin-top: 32px; }
  .profile-display { background-color: var(--bg-white); border-radius: var(--radius); border: 1px solid var(--border-color); box-shadow: var(--shadow); padding: 32px; margin-top: 24px; }
  .profile-header { border-bottom: 1px solid var(--border-color); padding-bottom: 24px; margin-bottom: 24px; }
  .profile-identity { display: flex; align-items: center; gap: 24px; }
  .profile-image-frame { width: 148px; height: 148px; flex: 0 0 148px; border-radius: 14px; overflow: hidden; background: var(--primary-light); border: 1px solid var(--border-color); }
  .animal-profile-image { width: 100%; height: 100%; object-fit: cover; display: block; }
  .animal-profile-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--primary-color); font-size: 56px; font-weight: 700; }
  .profile-car-id { display: inline-block; background-color: var(--primary-light); color: var(--primary-color); font-weight: 700; padding: 4px 12px; border-radius: 16px; font-size: 14px; margin-bottom: 12px; }
  .profile-title { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
  .profile-meta { color: var(--text-light); font-size: 15px; }
  .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  .detail-card { background-color: var(--bg-light); padding: 16px; border-radius: var(--radius); }
  .detail-card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-light); margin-bottom: 8px; }
  .detail-card-value { font-size: 16px; font-weight: 600; }
  .timeline { margin-top: 40px; }
  .timeline-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  .timeline-item { border-left: 2px solid var(--primary-color); padding-left: 20px; margin-bottom: 24px; position: relative; }
  .timeline-item::before { content: ''; position: absolute; left: -7px; top: 0; width: 12px; height: 12px; border-radius: 50%; background-color: var(--primary-color); }
  .timeline-date { font-size: 12px; font-weight: 700; color: var(--text-light); margin-bottom: 4px; }
  .timeline-content { font-size: 15px; }
  .event-flow-list { max-width: 980px; margin: 24px auto 0; }
  .event-flow-item { --event-date-width: 96px; --event-marker-width: 16px; display: grid; grid-template-columns: var(--event-date-width) var(--event-marker-width) minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 18px; }
  .event-flow-item:not(:last-child)::before { content: ''; position: absolute; left: calc(var(--event-date-width) + 14px + 7px); top: 26px; bottom: -2px; width: 2px; background: #d8e7df; }
  .event-flow-date { padding-top: 17px; color: var(--primary-dark); font-size: 13px; font-weight: 700; line-height: 1.3; text-align: right; }
  .event-flow-marker { z-index: 1; width: 14px; height: 14px; margin-top: 20px; border: 3px solid #fff; border-radius: 50%; background: var(--primary-color); box-shadow: 0 0 0 1px #a9cbbd; }
  .event-flow-item.is-conflict .event-flow-marker { background: var(--accent-color); box-shadow: 0 0 0 1px #e8b4a4; }
  .event-flow-card { min-width: 0; padding: 16px 18px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-white); box-shadow: 0 2px 8px rgba(35, 58, 48, 0.06); }
  .event-flow-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .event-flow-title-group { min-width: 0; }
  .event-flow-type { display: inline-block; margin-bottom: 5px; color: var(--primary-color); font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .event-flow-item.is-conflict .event-flow-type { color: #a84c35; }
  .event-flow-title-group h3 { color: var(--text-dark); font-size: 16px; line-height: 1.35; font-weight: 700; overflow-wrap: anywhere; }
  .event-flow-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
  .event-flow-status { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border-radius: 4px; background: #f2f4f3; color: #58645e; font-size: 11px; font-weight: 700; }
  .event-flow-status.is-verified { background: #e4f3e8; color: #176b3a; }
  .event-flow-status.is-rejected { background: #fce9e5; color: #a43b2e; }
  .event-flow-edit { padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 4px; background: #fff; color: var(--text-dark); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .event-flow-edit:hover { border-color: var(--primary-color); color: var(--primary-dark); }
  .event-flow-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #edf0ee; }
  .event-flow-facts span, .event-flow-outcome { min-width: 0; color: var(--text-dark); font-size: 13px; overflow-wrap: anywhere; }
  .event-flow-facts b, .event-flow-outcome b { display: block; margin-bottom: 2px; color: var(--text-light); font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .event-flow-outcome { margin-top: 12px; }
  .event-flow-media { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .event-flow-media .media-thumb { width: 76px; height: 76px; }
  .event-flow-empty { padding: 20px; border: 1px dashed #cbd8d1; border-radius: 8px; color: var(--text-light); text-align: center; }
  .media-gallery { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
  .media-thumb { width: 100px; height: 100px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border-color); }
  @media (max-width: 640px) { .profile-identity { align-items: flex-start; flex-direction: column; } .profile-image-frame { width: 128px; height: 128px; flex-basis: 128px; } }

  /* Match Cards & Search-Before-Create UI */
  .match-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 20px 0; }
  .match-card { background: var(--bg-white); border: 2px solid var(--border-color); border-radius: var(--radius); padding: 16px; position: relative; transition: border-color 0.2s; }
  .match-card.high-match { border-color: var(--accent-color); }
  .match-card.med-match { border-color: #E6A23C; }
  .match-score-badge { position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 12px; background: var(--primary-light); color: var(--primary-color); }
  .match-card.high-match .match-score-badge { background: #FCE8E6; color: #C5221F; }
  .match-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .btn-match-same { background: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .btn-match-diff { background: var(--bg-light); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .btn-match-notsure { background: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }

  /* Side-by-side comparison modal */
  .side-by-side-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: var(--bg-light); padding: 16px; border-radius: var(--radius); margin-bottom: 20px; }
  .side-panel { background: white; padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); }

  .loading-overlay {
    position: fixed; inset: 0; background-color: rgba(255, 255, 255, 0.7); display: none; align-items: center; justify-content: center; z-index: 9999;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid var(--primary-light); border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .form-message { padding: 16px; border-radius: 8px; margin-top: 24px; display: none; font-weight: 500; }
  .form-message.success { display: block; background-color: #E6F4EA; color: #137333; border: 1px solid #C2E7CD; }
  .form-message.error { display: block; background-color: #FCE8E6; color: #C5221F; border: 1px solid #FAD2CF; }
  .info-text { font-size: 13px; color: var(--text-light); }
  @media (max-width: 768px) {
    .event-flow-list { margin-top: 18px; }
    .event-flow-item { --event-date-width: 68px; --event-marker-width: 12px; grid-template-columns: var(--event-date-width) var(--event-marker-width) minmax(0, 1fr); gap: 8px; padding-bottom: 12px; }
    .event-flow-item:not(:last-child)::before { left: calc(var(--event-date-width) + 8px + 5px); top: 24px; }
    .event-flow-date { padding-top: 13px; font-size: 11px; }
    .event-flow-marker { width: 12px; height: 12px; margin-top: 17px; }
    .event-flow-card { padding: 12px; }
    .event-flow-card-top { flex-direction: column; gap: 8px; }
    .event-flow-actions { flex-wrap: wrap; }
    .event-flow-title-group h3 { font-size: 14px; }
    .event-flow-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; padding-top: 10px; }
    .navbar { padding: 10px 0; }
    .navbar .container { flex-direction: column; align-items: stretch; gap: 10px; padding: 0 16px; }
    .nav-brand { font-size: 16px; }
    .nav-slider { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; gap: 6px; }
    .nav-scroll-control { display: grid; place-items: center; width: 32px; height: 38px; padding: 0; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-white); color: var(--primary-dark); font-size: 24px; line-height: 1; cursor: pointer; }
    .nav-links { width: 100%; min-width: 0; gap: 10px; justify-content: flex-start; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; scroll-snap-type: x proximity; padding: 2px 0; }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links > * { flex: 0 0 auto; scroll-snap-align: start; }
    .nav-links a { font-size: 14px; }
    .nav-links .btn-primary, .nav-links .btn-secondary { padding: 8px 12px; }
    #adminSessionNav { flex: 0 0 auto; }
    .hero-content { grid-template-columns: 1fr; text-align: center; padding: 40px 0; }
    .hero-text h1 { font-size: 36px; }
    .hero-text .hero-desc { margin: 0 auto; }
    .hero-image { order: -1; }
    .gap-content { grid-template-columns: 1fr; gap: 24px; }
    .steps-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .detail-grid { grid-template-columns: 1fr; }
    .side-by-side-grid { grid-template-columns: 1fr; }
  }

  /* Form Element Inputs & Selects Styling */
  .form-group input[type="text"],
  .form-group input[type="date"],
  .form-group input[type="datetime-local"],
  .form-group input[type="number"],
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    font-size: 15px;
    outline: none;
    font-family: inherit;
    background-color: #ffffff;
    color: var(--text-dark);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-group input[type="text"]:focus,
  .form-group input[type="date"]:focus,
  .form-group input[type="datetime-local"]:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(45, 122, 95, 0.15);
  }
  .btn-gps {
    background-color: var(--primary-light);
    color: var(--primary-color);
    border: 1px solid var(--primary-color);
    padding: 8px 14px;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  /* Event Kind Toggle Buttons */
  .event-kind-toggle {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
    margin-bottom: 20px;
  }
  .event-kind-button {
    padding: 10px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    background-color: #ffffff;
    color: var(--text-dark);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .event-kind-button:hover {
    border-color: var(--primary-color);
    background-color: var(--primary-light);
  }
  .event-kind-button.active {
    background-color: var(--primary-color) !important;
    color: #ffffff !important;
    border-color: var(--primary-color) !important;
    box-shadow: 0 4px 12px rgba(45, 122, 95, 0.25);
  }
  .event-kind-button:disabled {
    cursor: not-allowed;
    opacity: 0.48;
    box-shadow: none;
  }
  .event-kind-notice {
    padding: 10px 12px;
    margin: 0 0 16px;
    border-left: 3px solid #b54708;
    background: #fff7ed;
    color: #7c2d12;
    font-size: 14px;
  }
  .event-admin-hidden {
    display: none !important;
  }

  /* Success Notification Cards */
  .success-banner-card {
    background: #f0fdf4;
    border: 2px solid #86efac;
    border-radius: 12px;
    padding: 24px;
    margin: 20px 0;
    box-shadow: 0 4px 14px rgba(22, 163, 74, 0.1);
    animation: fadeIn 0.3s ease;
  }
  .success-banner-card.info-theme {
    background: #f0f9ff;
    border-color: #7dd3fc;
    box-shadow: 0 4px 14px rgba(2, 132, 199, 0.1);
  }
  .success-header-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .success-icon-badge {
    font-size: 28px;
    line-height: 1;
  }
  .success-title {
    font-size: 20px;
    font-weight: 700;
    color: #166534;
    margin: 0;
  }
  .success-banner-card.info-theme .success-title {
    color: #0369a1;
  }
  .success-desc {
    font-size: 15px;
    color: #374151;
    margin-bottom: 16px;
  }
  .car-id-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #ffffff;
    border: 1px dashed #86efac;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 18px;
    width: fit-content;
    flex-wrap: wrap;
  }
  .car-id-box strong {
    font-size: 16px;
    font-family: monospace;
    color: var(--primary-dark);
  }
  .btn-copy {
    background: #e2e8f0;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  .btn-copy:hover {
    background: #cbd5e1;
  }
  .success-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Admin Hold Queue Cards with Dual Dog Names */
  .admin-hold-card {
    background: #ffffff;
    border: 2px solid #2D7A5F;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 22px;
    box-shadow: 0 4px 12px rgba(45, 122, 95, 0.08);
  }
  .admin-hold-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 12px;
    margin-bottom: 14px;
  }
  .dual-dog-names {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 16px;
    font-weight: 700;
  }
  .dog-tag-submitted {
    background: #e0f2fe;
    color: #0369a1;
    border: 1px solid #bae6fd;
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dog-tag-matched {
    background: #fef3c7;
    color: #b45309;
    border: 1px solid #fde68a;
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .vs-badge {
    background: #f1f5f9;
    color: #64748b;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 10px;
    letter-spacing: 1px;
  }
  .btn-eye {
    background: #e8f4f0;
    color: #2D7A5F;
    border: 1px solid #2D7A5F;
    padding: 8px 16px;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn-eye:hover {
    background: #2D7A5F;
    color: #ffffff;
  }

  /* Side-by-Side Comparison Modal */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
  }
  .modal-content-wide {
    background: #ffffff;
    border-radius: 14px;
    width: 100%;
    max-width: 1100px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid #e5e7eb;
    background: #f8fafc;
  }
  .modal-header h3 {
    margin: 0;
    font-size: 19px;
    color: var(--text-dark);
  }
  .btn-modal-close {
    background: none;
    border: none;
    font-size: 26px;
    line-height: 1;
    color: #6b7280;
    cursor: pointer;
    padding: 0 4px;
  }
  .btn-modal-close:hover {
    color: #111827;
  }
  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid #e5e7eb;
    background: #f8fafc;
    flex-wrap: wrap;
  }

  .comparison-columns-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .comparison-column {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 18px;
  }
  .comparison-column.col-submitted {
    border-top: 4px solid #0284c7;
  }
  .comparison-column.col-existing {
    border-top: 4px solid #d97706;
  }
  .comparison-col-header {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .comp-field-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f1f5f9;
    font-size: 14px;
  }
  .comp-label {
    font-weight: 600;
    color: #4b5563;
    width: 40%;
  }
  .comp-value {
    color: #111827;
    width: 60%;
    text-align: right;
    word-break: break-word;
  }
  .comp-photo-preview {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 14px;
    border: 1px solid #e5e7eb;
  }

  /* Timeline Event Media Linkage */
  .timeline-event-media {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .timeline-event-media img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .timeline-event-media img:hover {
    transform: scale(1.06);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .comparison-columns-grid {
      grid-template-columns: 1fr;
    }
  }

  /* ── Dashboard Page (W3.1 / W3.8) ────────────────────────────────────── */
  .dashboard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
  }
  .dashboard-header h2 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-dark);
  }
  .dashboard-header .dashboard-subtitle {
    font-size: 14px;
    color: var(--text-light);
    margin-top: 4px;
  }
  .btn-refresh {
    background: var(--primary-light);
    color: var(--primary-color);
    border: 1px solid var(--primary-color);
    padding: 9px 18px;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn-refresh:hover { background: var(--primary-color); color: #fff; }
  .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; }

  /* 8-card stat grid */
  .dash-stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .dash-stat-card {
    background: var(--bg-white);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: var(--shadow);
    transition: transform 0.15s;
  }
  .dash-stat-card:hover { transform: translateY(-2px); }
  .dash-stat-icon { font-size: 24px; line-height: 1; }
  .dash-stat-value {
    font-size: 34px;
    font-weight: 800;
    color: var(--primary-color);
    line-height: 1;
  }
  .dash-stat-label {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 600;
  }
  .dash-stat-card.accent .dash-stat-value  { color: var(--accent-color); }
  .dash-stat-card.warn  .dash-stat-value   { color: #E6A23C; }
  .dash-stat-card.info  .dash-stat-value   { color: #0369a1; }
  .dash-stat-card.alert .dash-stat-value   { color: #C5221F; }

  /* Species breakdown row */
  .dash-species-section {
    background: var(--bg-white);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .dash-section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 14px;
  }
  .species-breakdown-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .species-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-light);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 15px;
  }
  .species-chip .species-icon { font-size: 20px; }
  .species-chip .species-count { color: var(--primary-color); }

  /* Recent events table */
  .dash-recent-section {
    background: var(--bg-white);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
  }
  .dash-recent-section .dash-section-title { margin-bottom: 16px; }
  .recent-events-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .recent-events-table thead th {
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-light);
    padding: 8px 10px;
    border-bottom: 2px solid var(--border-color);
  }
  .recent-events-table tbody td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-dark);
    vertical-align: middle;
  }
  .recent-events-table tbody tr:last-child td { border-bottom: none; }
  .recent-events-table tbody tr:hover { background: var(--bg-light); cursor: pointer; }
  .dash-car-id-pill {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary-color);
    font-weight: 700;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .dash-event-type-pill {
    display: inline-block;
    background: #f1f5f9;
    color: #475569;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .dash-empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text-light);
    font-size: 15px;
  }
  .dash-loading {
    text-align: center;
    padding: 40px;
    color: var(--text-light);
    font-size: 15px;
  }

  @media (max-width: 900px) {
    .dash-stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .dash-stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .dash-stat-value { font-size: 26px; }
    .recent-events-table thead th:nth-child(n+4),
    .recent-events-table tbody td:nth-child(n+4) { display: none; }
  }

  /* ── Gallery View (W3.2) ──────────────────────────────────────────────── */
  .gallery-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  .gallery-header h2 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-dark);
  }
  .gallery-filters-bar {
    background: var(--bg-white);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .gallery-filter-search {
    flex: 2;
    min-width: 220px;
  }
  .gallery-filter-select {
    flex: 1;
    min-width: 140px;
  }
  .gallery-filter-info {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 600;
    margin-left: auto;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }
  .gallery-card {
    background: var(--bg-white);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .gallery-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.12);
    border-color: var(--primary-color);
  }
  .gallery-card-img-wrap {
    position: relative;
    width: 100%;
    height: 190px;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .gallery-card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .gallery-card-placeholder {
    font-size: 52px;
    color: var(--primary-color);
    font-weight: 800;
  }
  .gallery-card-species-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(4px);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .gallery-card-status-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .badge-healthy { background: #e6f4ea; color: #137333; border: 1px solid #c2e7cd; }
  .badge-treatment { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
  .badge-unknown { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

  .gallery-card-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .gallery-card-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .gallery-card-meta {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 8px;
  }
  .gallery-card-loc {
    font-size: 13px;
    color: var(--text-dark);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .gallery-card-footer {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
  }
  .gallery-event-count-pill {
    background: var(--primary-light);
    color: var(--primary-color);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* ── Profile Summary Card (W3.3) ──────────────────────────────────────── */
  .profile-summary-card {
    background: #ffffff;
    border: 2px solid var(--primary-color);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 16px rgba(45, 122, 95, 0.12);
  }
  .summary-top-row {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .summary-photo-frame {
    width: 140px;
    height: 140px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    flex-shrink: 0;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .summary-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .summary-info {
    flex: 1;
  }
  .summary-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .summary-name {
    font-size: 26px;
    font-weight: 800;
    color: var(--text-dark);
  }
  .summary-meta-line {
    font-size: 14px;
    color: var(--text-light);
    margin-bottom: 10px;
  }
  .summary-badges-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .summary-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 14px;
    background: var(--bg-light);
    border: 1px solid var(--border-color);
    color: var(--text-dark);
  }
  .summary-badge.healthy { background: #e6f4ea; color: #137333; border-color: #c2e7cd; }
  .summary-badge.treatment { background: #fef3c7; color: #b45309; border-color: #fde68a; }
  .summary-badge.vacc { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
  .summary-badge.abc { background: #f3e8ff; color: #7e22ce; border-color: #e9d5ff; }

  .summary-latest-box {
    background: var(--bg-light);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .summary-latest-text {
    font-size: 13px;
    color: var(--text-dark);
  }
  .summary-latest-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-light);
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .summary-actions-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 10px;
  }

  @media (max-width: 640px) {
    .summary-top-row { flex-direction: column; }
    .summary-photo-frame { width: 100%; height: 200px; }
  }

  /* ── Admin Tabs & Portal (W3.6) ───────────────────────────────────────── */
  .admin-tabs {
    display: flex;
    gap: 8px;
    border-bottom: 2px solid var(--border-color);
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .admin-tab-btn {
    background: none;
    border: none;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .admin-tab-btn:hover {
    color: var(--primary-color);
  }
  .admin-tab-btn.active {
    color: var(--primary-color);
    border-bottom-color: var(--primary-color);
  }
  .admin-tab-badge {
    background: var(--primary-light);
    color: var(--primary-color);
    font-size: 12px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 12px;
  }
  .admin-tab-btn.active .admin-tab-badge {
    background: var(--primary-color);
    color: #ffffff;
  }
  .admin-tab-pane {
    animation: fadeIn 0.2s ease;
  }

  /* Admin Records Card */
  .admin-record-card {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .admin-record-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
  }
  .admin-actions-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #f1f5f9;
  }
  .btn-admin-approve {
    background: #137333;
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: var(--radius);
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .btn-admin-approve:hover { background: #0d5424; }
  .btn-admin-reject {
    background: #fce8e6;
    color: #c5221f;
    border: 1px solid #fad2cf;
    padding: 8px 16px;
    border-radius: var(--radius);
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn-admin-reject:hover { background: #f8b4af; }

  /* Audit table */
  .audit-table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    font-size: 13px;
  }
  .audit-table th {
    background: #f8fafc;
    color: var(--text-light);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 12px 14px;
    text-align: left;
    border-bottom: 2px solid var(--border-color);
  }
  .audit-table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-dark);
    vertical-align: top;
  }
  .audit-table tr:hover { background: var(--bg-light); }
  .audit-diff-old {
    color: #c5221f;
    background: #fce8e6;
