<script>
  // Global application state
  let uploadedFiles = [];
  let sbcUploadedFiles = [];
  let eventUploadedFiles = [];
  let sterilizationUploadedFiles = [];
  let isSubmitting = false;

  // --- 1. Page Navigation --------------------------------------------------------
  function showPage(pageName) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(page => page.classList.remove('active'));

    const targetPage = document.getElementById(`page-${pageName}`);
    if (targetPage) {
      targetPage.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (pageName === 'search') {
        loadSearchStats();
        loadProfiles();
      } else if (pageName === 'admin') {
        loadAdminHolds();
      }
    }
  }

  // --- 2. Geolocation Helpers ---------------------------------------------------
  function getSbcGPSLocation() {
    captureGPS('sbcGpsCoordinates');
  }

  function getContributorGPSLocation() {
    captureGPS('gpsCoordinates', 'gpsLatitude', 'gpsLongitude', 'gpsCapturedMethod', 'gpsStatusDisplay');
  }

  function captureGPS(coordInputId, latInputId, lngInputId, methodInputId, statusDisplayId) {
    const coordInput = document.getElementById(coordInputId);
    const latInput = latInputId ? document.getElementById(latInputId) : null;
    const lngInput = lngInputId ? document.getElementById(lngInputId) : null;
    const methodInput = methodInputId ? document.getElementById(methodInputId) : null;
    const statusEl = statusDisplayId ? document.getElementById(statusDisplayId) : null;

    if (!navigator.geolocation) {
      alert('Geolocation is not supported by your browser. Please enter coordinates manually.');
      return;
    }

    if (coordInput) coordInput.placeholder = 'GPS: Capturing GPS...';
    if (statusEl) statusEl.innerHTML = '<span style="color:#2D7A5F;">GPS: Requesting location permission...</span>';

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = Math.round(position.coords.accuracy);

        if (coordInput) coordInput.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        if (latInput) latInput.value = lat;
        if (lngInput) lngInput.value = lng;
        if (methodInput) methodInput.value = 'Device GPS';
        if (statusEl) statusEl.innerHTML = `<span style="color:#137333; font-weight:600;">GPS: Captured: ${lat.toFixed(5)}, ${lng.toFixed(5)} (+/-${accuracy}m)</span>`;
      },
      (error) => {
        console.warn('GPS error:', error.message);
        if (coordInput) coordInput.placeholder = 'Latitude, Longitude';
        if (methodInput) methodInput.value = 'Manual Entry';
        if (statusEl) statusEl.innerHTML = '<span style="color:#E6A23C;">[!] Could not get device GPS. Please enter coordinates or landmark manually.</span>';
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  }

  // --- 3. Image URL Resolution --------------------------------------------------
  function getDirectDriveImageUrl(fileIdOrUrl) {
    if (!fileIdOrUrl) return '';
    const str = String(fileIdOrUrl).trim();
    if (str.startsWith('data:image')) return str;
    let fileId = str;
    if (str.includes('id=')) {
      fileId = str.split('id=')[1].split('&')[0];
    } else if (str.includes('/d/')) {
      fileId = str.split('/d/')[1].split('/')[0];
    }
    if (/^[a-zA-Z0-9_-]{20,}$/.test(fileId)) {
      return 'https://lh3.googleusercontent.com/d/' + fileId;
    }
    return str;
  }

  // --- 4. Search-Before-Create (Step 1) -----------------------------------------
  function handleSbcAnimalTypeChange(val) {
    const field = document.getElementById('sbcFieldNativeDog');
    if (field) field.style.display = (val === 'Dog') ? '' : 'none';
  }

  function handleSbcBreedTypeChange(val) {
    // handled by dropdown selection
  }

  function handleSbcPhotoSelect(event) {
    const files = Array.from(event.target.files);
    const previewEl = document.getElementById('sbcPhotoPreview');
    if (previewEl) previewEl.innerHTML = '';
    sbcUploadedFiles = [];

    for (const file of files) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Data = e.target.result;
        sbcUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data, visibility: 'Restricted', source: 'Self-reported' });
        if (previewEl) {
          previewEl.innerHTML += `
            <div style="display:inline-block; margin-right:8px; text-align:center;">
              <img src="${base64Data}" style="width:80px; height:80px; object-fit:cover; border-radius:6px; border:2px solid #2D7A5F;" />
              <div style="font-size:11px; color:#555; max-width:80px; overflow:hidden; text-overflow:ellipsis;">${file.name}</div>
            </div>
          `;
        }
      };
      reader.readAsDataURL(file);
    }
  }

  function handleSearchBeforeCreate() {
    const animalType = document.getElementById('sbcAnimalType')?.value?.trim();
    const area = document.getElementById('sbcArea')?.value?.trim();
    const animalName = document.getElementById('sbcAnimalName')?.value?.trim();
    const sex = document.getElementById('sbcSex')?.value?.trim();
    const breedType = document.getElementById('sbcBreedType')?.value?.trim();
    const nativeDogType = document.getElementById('sbcNativeDogType')?.value?.trim();
    const caregiverType = document.getElementById('sbcCaregiverType')?.value?.trim();
    const identificationMarks = document.getElementById('sbcIdentificationMarks')?.value?.trim();

    const resultsContainer = document.getElementById('searchBeforeCreateResults');
    const fullFormSection = document.getElementById('fullProfileFormSection');

    if (!animalType || !area) {
      alert('Please select Animal Type and enter Area/Locality to search.');
      if (!animalType) document.getElementById('sbcAnimalType')?.focus();
      else if (!area) document.getElementById('sbcArea')?.focus();
      return;
    }

    resultsContainer.innerHTML = '<div style="padding:16px; color:#2D7A5F; font-weight:600;">Search: Searching candidate profiles in ' + area + '...</div>';
    resultsContainer.style.display = 'block';

    google.script.run
      .withSuccessHandler((response) => {
        if (!response || !response.success) {
          const errMsg = (response && response.error) ? response.error : 'Search failed or returned empty response.';
          resultsContainer.innerHTML = `<div class="form-message error">${errMsg}</div>`;
          return;
        }

        if (!response.matchesFound || response.candidates.length === 0) {
          resultsContainer.innerHTML = `
            <div style="background:#E6F4EA; border:1px solid #C2E7CD; padding:16px; border-radius:8px; margin-bottom:16px;">
              <strong style="color:#137333; font-size:16px;">[OK] No Matching Animal Found in ${area}!</strong>
              <p style="margin-top:6px; color:#333;">You are good to create a new profile for this animal. All details entered above have been auto-filled into the profile creation form below.</p>
            </div>
          `;
          autoFillProfileFormFromSbc();
          if (fullFormSection) {
            fullFormSection.style.display = 'block';
            fullFormSection.scrollIntoView({ behavior: 'smooth' });
          }
          return;
        }

        // Render Match Comparison Cards with Side-by-Side Verification
        let userPhotoHtml = '';
        if (sbcUploadedFiles.length > 0 && sbcUploadedFiles[0].base64Data) {
          userPhotoHtml = `
            <div style="background:#f9f9f9; border:1px solid #ddd; padding:12px; border-radius:8px; margin-bottom:14px; text-align:center;">
              <strong style="font-size:13px; color:#555;">Photo: Your Submitted Photo (Side-by-Side Comparison)</strong><br>
              <img src="${sbcUploadedFiles[0].base64Data}" style="max-height:140px; max-width:100%; border-radius:6px; margin-top:6px;" />
            </div>
          `;
        }

        let html = `
          <div style="background:#FFF3E0; border:1px solid #FFE0B2; padding:16px; border-radius:8px; margin-bottom:16px;">
            <strong style="color:#D97706; font-size:16px;">[!] Potential Candidate Matches Found in ${area}!</strong>
            <p style="font-size:14px; margin-top:4px; color:#555;">Compare the candidate details and photo side-by-side before deciding whether to append an event or create a new record.</p>
          </div>
          ${userPhotoHtml}
          <div class="match-card-grid">
        `;

        response.candidates.forEach(c => {
          const isHigh = c.matchScore >= 70;
          const directImgUrl = getDirectDriveImageUrl(c.driveFileURL);
          html += `
            <div class="match-card ${isHigh ? 'high-match' : 'med-match'}">
              <span class="match-score-badge">${c.matchScore}% Match</span>
              <h4>${c.animalName} (${c.carProfileId})</h4>
              <p><strong>Type:</strong> ${c.animalType} | <strong>Sex:</strong> ${c.sex}</p>
              <p><strong>Locality:</strong> ${c.area}</p>
              <p><strong>Marks:</strong> ${c.identificationMarks || 'None'}</p>
              ${directImgUrl ? `<img src="${directImgUrl}" class="media-thumb" style="margin-top:8px; width:100%; max-height:160px; object-fit:cover; border-radius:6px;" />` : ''}
              
              <div class="match-actions" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
                <button type="button" class="btn-match-same" onclick="selectSameAnimal('${c.carProfileId}', '${c.animalName}')">
                  [OK] Same Animal (Add Event to History)
                </button>
                <button type="button" class="btn-match-notsure" onclick="selectNotSure('${c.carProfileId}', ${c.matchScore})">
                  [?] Not Sure (Hold for Admin Review)
                </button>
              </div>
            </div>
          `;
        });

        html += `
          </div>
          <div style="margin-top:20px; text-align:center; padding:16px; background:#f9f9f9; border-radius:8px;">
            <p style="margin-bottom:10px; font-weight:500;">None of these match your animal?</p>
            <button type="button" class="btn-primary" onclick="selectDifferentAnimal()">
              Animal: None of these  --  Proceed with New Profile Creation
            </button>
          </div>
        `;

        resultsContainer.innerHTML = html;
      })
      .withFailureHandler((err) => {
        resultsContainer.innerHTML = `<div class="form-message error">Search Error: ${err.message}</div>`;
      })
      .apiSearchBeforeCreate({ animalType, area, animalName, sex, breedType, identificationMarks });
  }

  function autoFillProfileFormFromSbc() {
    const setVal = (name, val) => {
      if (!val) return;
      const el = document.querySelector(`[name="${name}"]`);
      if (el) el.value = val;
    };

    const sbcAnimalType = document.getElementById('sbcAnimalType')?.value;
    const sbcArea = document.getElementById('sbcArea')?.value;
    const sbcAnimalName = document.getElementById('sbcAnimalName')?.value;
    const sbcSex = document.getElementById('sbcSex')?.value;
    const sbcBreedType = document.getElementById('sbcBreedType')?.value;
    const sbcNativeDogType = document.getElementById('sbcNativeDogType')?.value;
    const sbcCaregiverType = document.getElementById('sbcCaregiverType')?.value;
    const sbcIdentificationMarks = document.getElementById('sbcIdentificationMarks')?.value;
    const sbcGpsCoordinates = document.getElementById('sbcGpsCoordinates')?.value;

    setVal('animalType', sbcAnimalType);
    setVal('area', sbcArea);
    setVal('animalName', sbcAnimalName);
    setVal('sex', sbcSex);
    setVal('breedType', sbcBreedType);
    setVal('nativeDogType', sbcNativeDogType);

    if (sbcCaregiverType) {
      setVal('caregiverType', sbcCaregiverType);
      setVal('caregiverAnswer', 'Yes');
      const caregiverWhoEl = document.getElementById('fieldCaregiverWho');
      if (caregiverWhoEl) caregiverWhoEl.style.display = '';
    }

    setVal('identificationMarks', sbcIdentificationMarks);

    if (sbcGpsCoordinates) {
      const gpsInput = document.getElementById('gpsCoordinates');
      if (gpsInput) gpsInput.value = sbcGpsCoordinates;
    }

    if (sbcUploadedFiles && sbcUploadedFiles.length > 0) {
      uploadedFiles = [...sbcUploadedFiles];
      const listEl = document.getElementById('fileList');
      if (listEl) {
        listEl.innerHTML = '';
        uploadedFiles.forEach(f => {
          listEl.innerHTML += `<div>File: ${f.filename}</div>`;
        });
      }
    }

    if (sbcAnimalType === 'Dog') {
      const fieldNative = document.getElementById('fieldNativeDogType');
      if (fieldNative) fieldNative.style.display = '';
    }
  }

  function selectSameAnimal(carProfileId, animalName) {
    if (confirm(`Open Add Event form to append event history for ${animalName} (${carProfileId})?`)) {
      showPage('event');
      document.getElementById('eventCarProfileId').value = carProfileId;
    }
  }

  function selectDifferentAnimal() {
    autoFillProfileFormFromSbc();
    const fullFormSection = document.getElementById('fullProfileFormSection');
    if (fullFormSection) {
      fullFormSection.style.display = 'block';
      fullFormSection.scrollIntoView({ behavior: 'smooth' });
    }
    const resultsContainer = document.getElementById('searchBeforeCreateResults');
    if (resultsContainer) resultsContainer.style.display = 'none';
  }

  function selectNotSure(matchedCarProfileId, matchScore) {
    if (!confirm('Flag submission on HOLD for Admin side-by-side review?')) return;

    autoFillProfileFormFromSbc();
    const data = gatherProfileFormData();
    if (sbcUploadedFiles.length > 0 && (!data.media || data.media.length === 0)) {
      data.media = sbcUploadedFiles;
    }

    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success) {
          alert('Submission placed on HOLD (ID: ' + res.holdId + '). Sent to Admin for side-by-side review.');
          showPage('search');
        } else {
          alert('Error: ' + ((res && res.error) || 'Failed to submit hold.'));
        }
      })
      .apiSaveUncertainMatch({
        matchedCarProfileId: matchedCarProfileId,
        matchScore: matchScore,
        submittedData: data
      });
  }

  function closeMatchModal() {
    const modal = document.getElementById('matchResultsModal');
    if (modal) modal.style.display = 'none';
  }

  // --- 5. Conditional Field Handlers (Profile Form) ---------------------------
  function handleAnimalTypeChange(val) {
    const nativeField = document.getElementById('fieldNativeDogType');
    if (nativeField) nativeField.style.display = (val === 'Dog') ? '' : 'none';
  }

  function handleNativeBreedChange(val) {
    const otherField = document.getElementById('fieldBreedOther');
    if (otherField) otherField.style.display = (val === 'Other') ? '' : 'none';
  }

  function handleBreedTypeChange(val) {
    const otherField = document.getElementById('fieldBreedOther');
    if (otherField) otherField.style.display = (val === 'Other') ? '' : 'none';
  }

  function handleCaregiverChange(val) {
    const who = document.getElementById('fieldCaregiverWho');
    const care = document.getElementById('fieldCareProvided');
    if (who) who.style.display = (val === 'Yes') ? '' : 'none';
    if (care) care.style.display = (val === 'Yes') ? '' : 'none';
  }

  function handleCaregiverTypeChange(val) {
    const other = document.getElementById('fieldCaregiverOther');
    if (other) other.style.display = (val === 'Other') ? '' : 'none';
  }

  function handleCareTypeChange(val) {
    const other = document.getElementById('fieldCareOther');
    if (other) other.style.display = (val === 'Other') ? '' : 'none';
  }

  // --- 6. File Upload Handlers ------------------------------------------------
  async function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFileSelect(event) {
    const files = Array.from(event.target.files);
    const listEl = document.getElementById('fileList');
    if (listEl) listEl.innerHTML = '';
    uploadedFiles = [];
    for (const file of files) {
      const base64Data = await readFileAsBase64(file);
      uploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data, visibility: 'Restricted', source: 'Self-reported' });
      if (listEl) listEl.innerHTML += `<div>File: ${file.name} (${(file.size/1024).toFixed(1)} KB)</div>`;
    }
  }

  async function handleEventFileSelect(event) {
    const files = Array.from(event.target.files);
    const listEl = document.getElementById('eventFileList');
    if (listEl) listEl.innerHTML = '';
    eventUploadedFiles = [];
    for (const file of files) {
      const base64Data = await readFileAsBase64(file);
      eventUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data, visibility: 'Restricted', source: 'Self-reported' });
      if (listEl) listEl.innerHTML += `<div>File: ${file.name} (${(file.size/1024).toFixed(1)} KB)</div>`;
    }
  }

  async function handleSterilizationFileSelect(event) {
    const files = Array.from(event.target.files);
    const listEl = document.getElementById('sterilizationFileList');
    if (listEl) listEl.innerHTML = '';
    sterilizationUploadedFiles = [];
    for (const file of files) {
      const base64Data = await readFileAsBase64(file);
      sterilizationUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data, visibility: 'Restricted', source: 'Self-reported' });
      if (listEl) listEl.innerHTML += `<div>File: ${file.name} (${(file.size/1024).toFixed(1)} KB)</div>`;
    }
  }

  // --- 7. Profile Form Submit --------------------------------------------------
  function handleProfileSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (isSubmitting) return;

    const form = document.getElementById('profileForm');
    const submitBtn = form ? form.querySelector('button[type="submit"]') : null;
    if (submitBtn) { submitBtn.disabled = true; submitBtn.innerText = 'Saving Profile...'; }
    isSubmitting = true;

    showLoading(true);
    const messageEl = document.getElementById('formMessage');
    if (messageEl) { messageEl.className = 'form-message'; messageEl.style.display = 'none'; }

    const data = gatherProfileFormData();

    google.script.run
      .withSuccessHandler((response) => {
        showLoading(false);
        isSubmitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = 'Create Profile'; }

        if (response && response.success) {
          alert('[OK] Profile Created Successfully! CAR Profile ID: ' + response.carProfileId);
          uploadedFiles = [];
          sbcUploadedFiles = [];
          if (form) form.reset();
          handleSearchById(response.carProfileId, 'New Profile Created Successfully!');
        } else {
          if (messageEl) {
            messageEl.className = 'form-message error';
            messageEl.style.display = 'block';
            messageEl.innerText = 'Error saving profile: ' + ((response && response.error) || 'Unknown error');
          }
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        isSubmitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = 'Create Profile'; }
        if (messageEl) {
          messageEl.className = 'form-message error';
          messageEl.innerText = 'Server Error: ' + err.message;
          messageEl.style.display = 'block';
        }
      })
      .apiSaveProfile(data);
  }

  function gatherProfileFormData() {
    const getVal = (selector, fallback = '') => {
      const el = document.querySelector(selector);
      return el ? el.value.trim() : fallback;
    };
    const getById = (id, fallback = '') => {
      const el = document.getElementById(id);
      return el ? el.value.trim() : fallback;
    };

    return {
      contributor: {
        name: getVal('[name="contributorName"]'),
        mobile: getVal('[name="contributorMobile"]'),
        email: getVal('[name="contributorEmail"]')
      },
      animal: {
        animalType: getVal('[name="animalType"]') || getById('sbcAnimalType', 'Dog'),
        animalName: getVal('[name="animalName"]') || getById('sbcAnimalName', 'Unknown'),
        sex: getVal('[name="sex"]') || getById('sbcSex', 'Unknown'),
        age: getVal('[name="age"]', 'Unknown'),
        breedType: getVal('[name="breedType"]') || getById('sbcBreedType', ''),
        nativeDogType: getVal('[name="nativeDogType"]') || getById('sbcNativeDogType', ''),
        breedOtherDetails: getVal('[name="breedOtherDetails"]'),
        caregiverAnswer: getVal('[name="caregiverAnswer"]', 'Yes'),
        caregiverType: getVal('[name="caregiverType"]') || getById('sbcCaregiverType', ''),
        caregiverOtherDetails: getVal('[name="caregiverOtherDetails"]'),
        careProvided: getVal('[name="careProvided"]'),
        careOtherDetails: getVal('[name="careOtherDetails"]')
      },
      location: {
        area: getVal('[name="area"]') || getById('sbcArea', ''),
        city: getVal('[name="city"]'),
        state: getVal('[name="state"]', 'Telangana'),
        usualLocationType: getVal('[name="usualLocationType"]', 'Residential area'),
        landmark: getVal('[name="landmark"]'),
        gpsCoordinates: getById('gpsCoordinates') || getById('sbcGpsCoordinates', ''),
        gpsLatitude: getById('gpsLatitude'),
        gpsLongitude: getById('gpsLongitude'),
        gpsCapturedMethod: getById('gpsCapturedMethod', 'Manual Entry'),
        seenRegularly: getVal('[name="seenRegularly"]', 'Yes')
      },
      baselineStatus: {
        healthStatus: getVal('[name="healthStatus"]', 'Healthy'),
        vaccinationStatus: getVal('[name="vaccinationStatus"]', 'Unknown'),
        sterilisationStatus: getVal('[name="sterilisationStatus"]', 'Unknown'),
        behavior: getVal('[name="behavior"]', 'Friendly'),
        abcStatus: getVal('[name="abcStatus"]'),
        abcOutcome: getVal('[name="abcOutcome"]'),
        identificationMarks: getVal('[name="identificationMarks"]') || getById('sbcIdentificationMarks', 'None visible'),
        identificationOtherDetails: getVal('[name="identificationOtherDetails"]'),
        additionalDetails: getVal('[name="additionalDetails"]')
      },
      media: uploadedFiles.length > 0 ? uploadedFiles : sbcUploadedFiles
    };
  }

  // --- 8. Event Form Submit ---------------------------------------------------
  function handleEventSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (isSubmitting) return;

    const form = document.getElementById('eventForm');
    const submitBtn = form ? form.querySelector('button[type="submit"]') : null;
    if (submitBtn) { submitBtn.disabled = true; submitBtn.innerText = 'Saving Event...'; }
    isSubmitting = true;
    showLoading(true);

    const carProfileId = document.getElementById('eventCarProfileId')?.value?.trim();
    const activePanel = document.querySelector('.event-kind-button.active')?.dataset?.eventKind || 'Vaccination or Preventive Care';
    const mediaFiles = activePanel === 'Sterilization' ? sterilizationUploadedFiles : eventUploadedFiles;

    const getVal = (selector, fallback = '') => {
      const el = form ? form.querySelector(selector) : null;
      return el ? el.value.trim() : fallback;
    };
    const getChecked = (name) => {
      if (!form) return '';
      return Array.from(form.querySelectorAll(`[name="${name}"]:checked`)).map(cb => cb.value).join(', ');
    };

    let eventPayload = { eventType: activePanel };

    if (activePanel === 'Vaccination or Preventive Care') {
      eventPayload = {
        eventType: activePanel,
        eventCategory: getVal('[name="preventiveCareType"]'),
        eventOtherDetails: getVal('[name="preventiveCareOtherDetails"]'),
        dateOfEvent: getVal('[name="preventiveCareDate"]'),
        organisationOrPerson: getVal('[name="preventiveCareGivenBy"]'),
        additionalDetails: getVal('[name="vaccineProductName"]')
      };
    } else if (activePanel === 'Medical Treatment') {
      eventPayload = {
        eventType: activePanel,
        dateOfEvent: getVal('[name="medicalTreatmentDate"]'),
        healthCondition: getChecked('medicalTreatmentHealthCondition'),
        behaviour: getChecked('medicalTreatmentBehaviour'),
        eventCategory: getChecked('medicalTreatmentReason'),
        eventDescription: getVal('[name="medicalTreatmentGiven"]'),
        organisationOrPerson: getVal('[name="medicalTreatmentProvidedBy"]'),
        additionalDetails: getVal('[name="medicalTreatmentAdditionalDetails"]')
      };
    } else if (activePanel === 'Sterilization') {
      eventPayload = {
        eventType: activePanel,
        dateReported: getVal('[name="sterilizationDateReported"]'),
        healthCondition: getChecked('sterilizationHealthCondition'),
        behaviour: getChecked('sterilizationBehaviour'),
        vaccinated: getVal('[name="sterilizationVaccinated"]'),
        sterilised: getVal('[name="sterilizationStatus"]'),
        identificationMarks: getChecked('sterilizationIdentificationMarks'),
        eventCategory: getChecked('sterilizationProcedureActions'),
        dateOfEvent: getVal('[name="sterilizationProcedureDate"]'),
        organisationOrPerson: getVal('[name="sterilizationPerformedBy"]'),
        outcomeCurrentStatus: getVal('[name="sterilizationRecoveryStatus"]'),
        additionalDetails: getVal('[name="sterilizationAdditionalDetails"]')
      };
    }

    const messageEl = document.getElementById('eventMessage');
    google.script.run
      .withSuccessHandler((res) => {
        showLoading(false);
        isSubmitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = 'Save Event'; }
        if (res && res.success) {
          alert('[OK] Event saved! Event ID: ' + res.eventId);
          eventUploadedFiles = [];
          sterilizationUploadedFiles = [];
          if (form) form.reset();
          handleSearchById(carProfileId, 'Event Added Successfully!');
        } else {
          if (messageEl) {
            messageEl.className = 'form-message error';
            messageEl.style.display = 'block';
            messageEl.innerText = 'Error: ' + ((res && res.error) || 'Unknown error');
          }
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        isSubmitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = 'Save Event'; }
        if (messageEl) {
          messageEl.className = 'form-message error';
          messageEl.style.display = 'block';
          messageEl.innerText = 'Server Error: ' + err.message;
        }
      })
      .apiSaveEvent({ carProfileId, event: eventPayload, media: mediaFiles });
  }

  // --- 9. Search & Profile Display ---------------------------------------------
  function handleSearch() {
    const query = document.getElementById('searchInput')?.value?.trim();
    if (!query) return;
    handleSearchById(query);
  }

  function handleSearchById(carProfileId, bannerMessage = '') {
    showLoading(true);
    google.script.run
      .withSuccessHandler((response) => {
        showLoading(false);
        if (response && response.success && response.found) {
          renderProfileDisplay(response.profile, bannerMessage);
          showPage('profile');
        } else {
          google.script.run
            .withSuccessHandler((searchRes) => {
              if (searchRes && searchRes.success && searchRes.found && searchRes.profiles.length > 0) {
                if (searchRes.profiles.length === 1) {
                  handleSearchById(searchRes.profiles[0].carProfileId);
                } else {
                  const container = document.getElementById('searchResults');
                  if (container) {
                    let html = `<h3>Search Results for "${carProfileId}"</h3><div class="match-card-grid">`;
                    searchRes.profiles.forEach(p => {
                      html += `
                        <div class="match-card" style="cursor:pointer;" onclick="handleSearchById('${p.carProfileId}')">
                          <span class="profile-car-id">${p.carProfileId}</span>
                          <h4>${p.animalName} (${p.animalType})</h4>
                          <p><strong>Area:</strong> ${p.area || 'Unknown'}</p>
                          <button class="btn-primary" style="margin-top:8px; width:100%;">View Full Profile</button>
                        </div>
                      `;
                    });
                    html += `</div>`;
                    container.innerHTML = html;
                    showPage('search');
                  }
                }
              } else {
                alert('No animal profile found matching: ' + carProfileId);
              }
            })
            .apiSearchRecords(carProfileId);
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        alert('Search Error: ' + err.message);
      })
      .apiSearchProfile(carProfileId);
  }

  function renderProfileDisplay(profile, bannerMessage = '') {
    const display = document.getElementById('profileDisplay');
    if (!display || !profile) return;

    const a = profile.animal || {};
    const l = profile.location || {};
    const b = profile.baselineStatus || {};
    const events = profile.events || [];
    const media = profile.media || [];

    let bannerHtml = '';
    if (bannerMessage) {
      bannerHtml = `
        <div style="background-color:#e6f4ea; border:1px solid #c2e7cd; color:#137333; padding:16px; border-radius:8px; margin-bottom:20px; font-weight:600;">
          [OK] ${bannerMessage} (CAR ID: ${a.carProfileId})
        </div>
      `;
    }

    let mediaHtml = '';
    media.forEach(m => {
      if (m.driveFileURL) {
        const directUrl = getDirectDriveImageUrl(m.driveFileURL);
        mediaHtml += `<a href="${m.driveFileURL}" target="_blank"><img src="${directUrl}" class="media-thumb" title="${m.fileName || 'Media'}" /></a>`;
      }
    });

    let eventsHtml = '';
    events.forEach(e => {
      eventsHtml += `
        <div class="timeline-item">
          <div class="timeline-date">${e.dateOfEvent || e.timestamp} | ${e.eventType}</div>
          <div class="timeline-content">
            <p><strong>Description:</strong> ${e.eventDescription || 'No description'}</p>
            <p><span class="info-text">Source: ${e.source || 'Self-reported'} | Verification: ${e.verificationStatus || 'Unverified'}</span></p>
          </div>
        </div>
      `;
    });

    display.innerHTML = `
      ${bannerHtml}
      <div class="profile-header">
        <span class="profile-car-id">${a.carProfileId}</span>
        <h1 class="profile-title">${a.animalName}</h1>
        <div class="profile-meta">
          ${a.animalType} &bull; ${a.sex} &bull; ${a.age} &bull; Locality: ${l.area || 'Unknown'} ${l.landmark ? `(Near ${l.landmark})` : ''}
          ${l.gpsCoordinates ? `<br><small style="color:#2D7A5F;">GPS: GPS: ${l.gpsCoordinates} (${l.gpsCapturedMethod || 'Captured'})</small>` : ''}
        </div>
      </div>
      <div class="detail-grid">
        <div class="detail-card"><div class="detail-card-title">Health Condition</div><div class="detail-card-value">${b.healthStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Vaccination</div><div class="detail-card-value">${b.vaccinationStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Sterilisation</div><div class="detail-card-value">${b.sterilisationStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Identification Marks</div><div class="detail-card-value">${b.identificationMarks || 'None'}</div></div>
      </div>
      ${mediaHtml ? `<h3 style="margin-top:24px;">Media Evidence</h3><div class="media-gallery">${mediaHtml}</div>` : ''}
      <div class="timeline">
        <h3 class="timeline-title">Event & Care History</h3>
        ${eventsHtml || '<p class="info-text">No recorded events yet.</p>'}
      </div>
      <div style="margin-top:24px;">
        <button class="btn-primary" onclick="showPage('event'); document.getElementById('eventCarProfileId').value='${a.carProfileId}';">+ Add Event / Medical Update</button>
      </div>
    `;
  }

  function showLoading(active) {
    const el = document.getElementById('loadingOverlay');
    if (el) el.className = active ? 'loading-overlay active' : 'loading-overlay';
  }

  function loadSearchStats() {
    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.success) return;
        const row = document.getElementById('statsDisplay');
        if (row) {
          row.innerHTML = `
            <div class="stat-card"><div class="stat-number">${res.animalsCount}</div><div class="stat-label">Animals Profiled</div></div>
            <div class="stat-card"><div class="stat-number">${res.eventsCount}</div><div class="stat-label">Events Logged</div></div>
            <div class="stat-card"><div class="stat-number">${res.areasCount}</div><div class="stat-label">Areas Covered</div></div>
            <div class="stat-card"><div class="stat-number">${res.percentLinked}%</div><div class="stat-label">With Photo Evidence</div></div>
          `;
        }
      })
      .apiGetSearchStats();
  }

  function loadProfiles() {
    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.success) return;
        const container = document.getElementById('browseProfiles');
        if (!container) return;
        let html = '';
        res.profiles.forEach(p => {
          html += `
            <div class="detail-card" style="cursor:pointer;" onclick="document.getElementById('searchInput').value='${p.carProfileId}'; handleSearch();">
              <span class="profile-car-id">${p.carProfileId}</span>
              <h4>${p.animalName} (${p.animalType})</h4>
              <p class="info-text">Locality: ${p.area || 'Unknown'}</p>
            </div>
          `;
        });
        container.innerHTML = html;
      })
      .apiListProfiles();
  }

  // --- 10. Admin Hold Queue ----------------------------------------------------
  function loadAdminHolds() {
    const container = document.getElementById('adminHoldList');
    if (!container) return;
    container.innerHTML = '<p>Loading pending verification holds...</p>';

    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.success) {
          container.innerHTML = '<p class="form-message error">Failed to load holds: ' + ((res && res.error) || 'Unknown error') + '</p>';
          return;
        }
        if (!res.holds || res.holds.length === 0) {
          container.innerHTML = '<p style="color:#555; padding:16px; background:#e6f4ea; border-radius:8px;">[OK] No pending holds. All submissions have been reviewed.</p>';
          return;
        }

        let html = '';
        res.holds.forEach(h => {
          const submitted = h.submittedData || {};
          const animal = submitted.animal || {};
          const location = submitted.location || {};
          const media = submitted.media || [];
          const photoUrl = media.length > 0 && media[0].base64Data ? media[0].base64Data : '';

          html += `
            <div class="detail-card" style="margin-bottom:20px; border:2px solid #2D7A5F;">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <span class="profile-car-id">${h.holdId}</span>
                <span class="match-score-badge" style="position:static;">${h.matchScore}% Match Score</span>
              </div>
              <div style="margin-top:12px; display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:16px;">
                <div style="background:#fff; padding:12px; border-radius:8px; border:1px solid #ddd;">
                  <h4 style="margin-top:0; color:#2D7A5F;">Submitted Animal Record</h4>
                  <p><strong>Name:</strong> ${animal.animalName || 'Unknown'} (${animal.animalType || 'N/A'})</p>
                  <p><strong>Sex:</strong> ${animal.sex || 'Unknown'} | <strong>Breed:</strong> ${animal.breedType || animal.nativeDogType || 'Indie'}</p>
                  <p><strong>Locality:</strong> ${location.area || 'Unknown'}</p>
                  <p><strong>Marks:</strong> ${submitted.baselineStatus ? submitted.baselineStatus.identificationMarks : 'None'}</p>
                  ${photoUrl ? `<img src="${photoUrl}" style="max-width:100%; max-height:120px; border-radius:6px; margin-top:8px;" />` : ''}
                </div>
                <div style="background:#fff; padding:12px; border-radius:8px; border:1px solid #ddd;">
                  <h4 style="margin-top:0; color:#D97706;">Matched Against Profile</h4>
                  <p><strong>CAR ID:</strong> <a href="javascript:void(0)" onclick="handleSearchById('${h.matchedCarProfileId}')">${h.matchedCarProfileId}</a></p>
                  <p>Click the ID above to inspect existing profile details side-by-side.</p>
                </div>
              </div>
              <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
                <button class="btn-primary" onclick="resolveHold('${h.holdId}', 'APPROVE')">[OK] Approve (Create New Profile)</button>
                <button class="btn-secondary" style="background:#e8f0fe; color:#1a73e8; border:1px solid #dadce0;" onclick="resolveHold('${h.holdId}', 'CONFIRM_SAME')">Link: Confirm Same (Merge)</button>
                <button class="btn-secondary" style="background:#fce8e6; color:#c5221f; border:1px solid #fad2cf;" onclick="resolveHold('${h.holdId}', 'REJECT')">[X] Reject (Duplicate)</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      })
      .withFailureHandler((err) => {
        container.innerHTML = '<p class="form-message error">Error loading holds: ' + err.message + '</p>';
      })
      .apiGetPendingHolds();
  }

  function resolveHold(holdId, action) {
    const label = action === 'APPROVE' ? 'APPROVE and create new profile' : action === 'CONFIRM_SAME' ? 'CONFIRM as SAME animal' : 'REJECT as duplicate';
    if (!confirm(`Are you sure you want to ${label} for Hold ID ${holdId}?`)) return;

    showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        showLoading(false);
        if (res && res.success) {
          alert('[OK] Hold resolved successfully: ' + res.status);
          loadAdminHolds();
        } else {
          alert('Error resolving hold: ' + ((res && res.error) || 'Unknown error'));
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        alert('Server Error: ' + err.message);
      })
      .apiResolveHold(holdId, action, '');
  }

  // Explicit window bindings for Google Apps Script iframe sandbox compatibility
  window.showPage = showPage;
  window.getSbcGPSLocation = getSbcGPSLocation;
  window.getContributorGPSLocation = getContributorGPSLocation;
  window.captureGPS = captureGPS;
  window.getDirectDriveImageUrl = getDirectDriveImageUrl;
  window.handleSbcAnimalTypeChange = handleSbcAnimalTypeChange;
  window.handleSbcBreedTypeChange = handleSbcBreedTypeChange;
  window.handleSbcPhotoSelect = handleSbcPhotoSelect;
  window.handleSearchBeforeCreate = handleSearchBeforeCreate;
  window.autoFillProfileFormFromSbc = autoFillProfileFormFromSbc;
  window.selectSameAnimal = selectSameAnimal;
  window.selectDifferentAnimal = selectDifferentAnimal;
  window.selectNotSure = selectNotSure;
  window.closeMatchModal = closeMatchModal;
  window.handleAnimalTypeChange = handleAnimalTypeChange;
  window.handleNativeBreedChange = handleNativeBreedChange;
  window.handleBreedTypeChange = handleBreedTypeChange;
  window.handleCaregiverChange = handleCaregiverChange;
  window.handleCaregiverTypeChange = handleCaregiverTypeChange;
  window.handleCareTypeChange = handleCareTypeChange;
  window.handleFileSelect = handleFileSelect;
  window.handleEventFileSelect = handleEventFileSelect;
  window.handleSterilizationFileSelect = handleSterilizationFileSelect;
  window.handleProfileSubmit = handleProfileSubmit;
  window.handleEventSubmit = handleEventSubmit;
  window.handleEventTypeChange = handleEventTypeChange;
  window.handleSearch = handleSearch;
  window.handleSearchById = handleSearchById;
  window.renderProfileDisplay = renderProfileDisplay;
  window.loadSearchStats = loadSearchStats;
  window.loadProfiles = loadProfiles;
  window.loadAdminHolds = loadAdminHolds;
  window.resolveHold = resolveHold;

  // --- 11. Initial DOM Event Bindings ------------------------------------------
  document.addEventListener('DOMContentLoaded', () => {
    // Form submit listener
    const profileForm = document.getElementById('profileForm');
    if (profileForm) profileForm.addEventListener('submit', handleProfileSubmit);

    const eventForm = document.getElementById('eventForm');
    if (eventForm) eventForm.addEventListener('submit', handleEventSubmit);

    // Event kind toggle buttons
    document.querySelectorAll('.event-kind-button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.event-kind-button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const kind = btn.dataset.eventKind;
        const typeInput = document.getElementById('eventType');
        if (typeInput) typeInput.value = kind;
        document.querySelectorAll('.event-detail-panel').forEach(panel => {
          panel.style.display = panel.dataset.eventPanel === kind ? '' : 'none';
        });
      });
    });
  });
</script>
