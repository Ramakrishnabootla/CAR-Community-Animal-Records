<script>
  // Global state
  let uploadedFiles = [];
  let eventUploadedFiles = [];
  let profileRecords = {};
  let currentSearchCandidate = null;
  let isSubmitting = false;

  // Page navigation
  function showPage(pageName) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(page => page.classList.remove('active'));

    const targetPage = document.getElementById(`page-${pageName}`);
    if (targetPage) {
      targetPage.classList.add('active');

      if (pageName === 'search') {
        loadSearchStats();
        loadProfiles();
      } else if (pageName === 'admin') {
        loadAdminHolds();
      }
    }
  }

  // Native Client-Side HTML5 Geolocation (Zero Backend Server)
  function getContributorGPSLocation() {
    const statusEl = document.getElementById('gpsStatusDisplay');
    if (!statusEl) return;

    if (!navigator.geolocation) {
      statusEl.innerHTML = '<span style="color:#c5221f;">⚠️ Geolocation is not supported by your browser.</span>';
      return;
    }

    statusEl.innerHTML = '<span style="color:#2D7A5F;">📍 Requesting GPS location...</span>';

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = Math.round(position.coords.accuracy);

        document.getElementById('gpsLatitude').value = lat;
        document.getElementById('gpsLongitude').value = lng;
        document.getElementById('gpsCoordinates').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        document.getElementById('gpsCapturedMethod').value = 'Device GPS';

        statusEl.innerHTML = `<span style="color:#137333; font-weight:600;">📍 Location Captured: ${lat.toFixed(5)}, ${lng.toFixed(5)} (±${accuracy}m)</span>`;
      },
      (error) => {
        console.warn('GPS location error:', error.message);
        document.getElementById('gpsCapturedMethod').value = 'Manual Entry';
        statusEl.innerHTML = '<span style="color:#E6A23C;">⚠️ Permission denied/timed out. Enter area manually below.</span>';
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  // W2.1: Locality Search Before Create
  function handleSearchBeforeCreate() {
    const animalType = document.querySelector('[name="animalType"]')?.value;
    const area = document.querySelector('[name="area"]')?.value;
    const animalName = document.querySelector('[name="animalName"]')?.value;
    const sex = document.querySelector('[name="sex"]')?.value;
    const breedType = document.querySelector('[name="breedType"]')?.value;
    const identificationMarks = document.querySelector('[name="identificationMarks"]')?.value;

    const resultsContainer = document.getElementById('searchBeforeCreateResults');
    const fullFormSection = document.getElementById('fullProfileFormSection');

    if (!animalType || !area) {
      alert('Please select Animal Type and enter Area/Locality to search first.');
      return;
    }

    resultsContainer.innerHTML = '<div style="padding:16px;">🔍 Searching candidate profiles in ' + area + '...</div>';
    resultsContainer.style.display = 'block';

    google.script.run
      .withSuccessHandler((response) => {
        if (!response.success) {
          resultsContainer.innerHTML = `<div class="form-message error">${response.error}</div>`;
          return;
        }

        if (!response.matchesFound || response.candidates.length === 0) {
          resultsContainer.innerHTML = `
            <div style="background:#E6F4EA; border:1px solid #C2E7CD; padding:16px; border-radius:8px; margin-bottom:16px;">
              <strong>✅ No Matching Animal Found!</strong> You are good to create a new profile for this animal.
            </div>
          `;
          if (fullFormSection) fullFormSection.style.display = 'block';
          return;
        }

        // Render Match Comparison Cards
        let html = `
          <div style="background:#FFF3E0; border:1px solid #FFE0B2; padding:16px; border-radius:8px; margin-bottom:16px;">
            <strong>⚠️ Potential Candidate Matches Found in ${area}!</strong>
            <p style="font-size:14px; margin-top:4px;">Please check if this is the same animal before creating a new profile.</p>
          </div>
          <div class="match-card-grid">
        `;

        response.candidates.forEach(c => {
          const isHigh = c.matchScore >= 70;
          html += `
            <div class="match-card ${isHigh ? 'high-match' : 'med-match'}">
              <span class="match-score-badge">${c.matchScore}% Match</span>
              <h4>${c.animalName} (${c.carProfileId})</h4>
              <p><strong>Type:</strong> ${c.animalType} | <strong>Sex:</strong> ${c.sex}</p>
              <p><strong>Locality:</strong> ${c.area}</p>
              <p><strong>Marks:</strong> ${c.identificationMarks || 'None'}</p>
              ${c.driveFileURL ? `<img src="${c.driveFileURL}" class="media-thumb" style="margin-top:8px;" />` : ''}
              
              <div class="match-actions">
                <button type="button" class="btn-match-same" onclick="selectSameAnimal('${c.carProfileId}', '${c.animalName}')">
                  ✅ Same Animal (Add Event to History)
                </button>
                <button type="button" class="btn-match-notsure" onclick="selectNotSure('${c.carProfileId}', ${c.matchScore})">
                  ❓ Not Sure (Hold for Admin Review)
                </button>
              </div>
            </div>
          `;
        });

        html += `
          </div>
          <div style="margin-top:16px; text-align:center;">
            <button type="button" class="btn-secondary" onclick="selectDifferentAnimal()">
              🐾 None of these (Create Brand New Profile)
            </button>
          </div>
        `;

        resultsContainer.innerHTML = html;
      })
      .withFailureHandler((err) => {
        resultsContainer.innerHTML = `<div class="form-message error">Search Error: ${err.message}</div>`;
      })
      .apiSearchBeforeCreate({ animalType, area, animalName, sex, breedType, identificationMarks });
  }

  function selectSameAnimal(carProfileId, animalName) {
    if (confirm(`Open Add Event form to append event history for ${animalName} (${carProfileId})?`)) {
      showPage('event');
      document.getElementById('eventCarProfileId').value = carProfileId;
    }
  }

  function selectDifferentAnimal() {
    const fullFormSection = document.getElementById('fullProfileFormSection');
    if (fullFormSection) fullFormSection.style.display = 'block';
    const resultsContainer = document.getElementById('searchBeforeCreateResults');
    if (resultsContainer) resultsContainer.style.display = 'none';
  }

  function selectNotSure(matchedCarProfileId, matchScore) {
    if (!confirm('Flag submission on HOLD for Admin side-by-side review?')) return;

    const data = gatherProfileFormData();
    google.script.run
      .withSuccessHandler((res) => {
        if (res.success) {
          alert('Submission placed on HOLD (ID: ' + res.holdId + '). Sent to Admin for side-by-side review.');
          showPage('search');
        } else {
          alert('Error: ' + res.error);
        }
      })
      .apiSaveUncertainMatch({
        matchedCarProfileId: matchedCarProfileId,
        matchScore: matchScore,
        submittedData: data
      });
  }

  // Profile Form Handling with Double-Click Protection
  function handleProfileSubmit(e) {
    e.preventDefault();
    if (isSubmitting) return;

    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.innerText = 'Saving Profile...'; }
    isSubmitting = true;

    showLoading(true);
    const messageEl = document.getElementById('formMessage');
    messageEl.className = 'form-message';
    messageEl.style.display = 'none';

    const data = gatherProfileFormData();

    google.script.run
      .withSuccessHandler((response) => {
        showLoading(false);
        isSubmitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = 'Save Profile'; }

        if (response.success) {
          messageEl.className = 'form-message success';
          messageEl.innerHTML = `
            <h3>✅ Profile Created Successfully!</h3>
            <p><strong>CAR Profile ID:</strong> <span class="profile-car-id">${response.carProfileId}</span></p>
            <p style="margin-top:8px;">You can search or view history using this ID.</p>
          `;
          messageEl.style.display = 'block';
          e.target.reset();
          uploadedFiles = [];
        } else {
          messageEl.className = 'form-message error';
          messageEl.innerText = response.error;
          messageEl.style.display = 'block';
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        isSubmitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = 'Save Profile'; }
        messageEl.className = 'form-message error';
        messageEl.innerText = 'Server Error: ' + err.message;
        messageEl.style.display = 'block';
      })
      .apiSaveProfile(data);
  }

  function gatherProfileFormData() {
    return {
      contributor: {
        name: document.querySelector('[name="contributorName"]').value,
        mobile: document.querySelector('[name="contributorMobile"]').value,
        email: document.querySelector('[name="contributorEmail"]').value
      },
      animal: {
        animalType: document.querySelector('[name="animalType"]').value,
        animalName: document.querySelector('[name="animalName"]').value,
        sex: document.querySelector('[name="sex"]').value,
        age: document.querySelector('[name="age"]').value,
        breedType: document.querySelector('[name="breedType"]').value,
        nativeDogType: document.querySelector('[name="nativeDogType"]')?.value || '',
        breedOtherDetails: document.querySelector('[name="breedOtherDetails"]')?.value || '',
        caregiverAnswer: document.querySelector('[name="caregiverAnswer"]')?.value || '',
        caregiverType: document.querySelector('[name="caregiverType"]')?.value || '',
        careProvided: document.querySelector('[name="careProvided"]')?.value || ''
      },
      location: {
        area: document.querySelector('[name="area"]').value,
        city: document.querySelector('[name="city"]').value,
        state: document.querySelector('[name="state"]')?.value || 'Karnataka',
        usualLocationType: document.querySelector('[name="usualLocationType"]')?.value || 'Public Area',
        landmark: document.querySelector('[name="landmark"]')?.value || '',
        gpsCoordinates: document.getElementById('gpsCoordinates')?.value || '',
        gpsLatitude: document.getElementById('gpsLatitude')?.value || '',
        gpsLongitude: document.getElementById('gpsLongitude')?.value || '',
        gpsCapturedMethod: document.getElementById('gpsCapturedMethod')?.value || 'Manual Entry',
        seenRegularly: document.querySelector('[name="seenRegularly"]')?.value || 'Yes'
      },
      baselineStatus: {
        healthStatus: document.querySelector('[name="healthStatus"]').value,
        vaccinationStatus: document.querySelector('[name="vaccinationStatus"]')?.value || 'Unknown',
        sterilisationStatus: document.querySelector('[name="sterilisationStatus"]')?.value || 'Unknown',
        behavior: document.querySelector('[name="behavior"]').value,
        identificationMarks: document.querySelector('[name="identificationMarks"]').value
      },
      media: uploadedFiles
    };
  }

  // Search profile by exact ID
  function handleSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;

    showLoading(true);
    google.script.run
      .withSuccessHandler((response) => {
        showLoading(false);
        if (response.success && response.found) {
          renderProfileDisplay(response.profile);
          showPage('profile');
        } else {
          alert('Profile not found for ID: ' + query);
        }
      })
      .withFailureHandler((err) => { showLoading(false); alert('Error: ' + err.message); })
      .apiSearchProfile(query);
  }

  function renderProfileDisplay(profile) {
    const display = document.getElementById('profileDisplay');
    const a = profile.animal;
    const l = profile.location || {};
    const b = profile.baselineStatus || {};
    const events = profile.events || [];
    const media = profile.media || [];

    let mediaHtml = '';
    media.forEach(m => {
      if (m.driveFileURL) mediaHtml += `<a href="${m.driveFileURL}" target="_blank"><img src="${m.driveFileURL}" class="media-thumb" /></a>`;
    });

    let eventsHtml = '';
    events.forEach(e => {
      eventsHtml += `
        <div class="timeline-item">
          <div class="timeline-date">${e.dateOfEvent || e.timestamp} | ${e.eventType}</div>
          <div class="timeline-content">
            <p><strong>Description:</strong> ${e.eventDescription || 'No description'}</p>
            <p><span class="info-text">Source: ${e.source} | Status: ${e.verificationStatus}</span></p>
          </div>
        </div>
      `;
    });

    display.innerHTML = `
      <div class="profile-header">
        <span class="profile-car-id">${a.carProfileId}</span>
        <h1 class="profile-title">${a.animalName}</h1>
        <div class="profile-meta">
          ${a.animalType} • ${a.sex} • ${a.age} • Locality: ${l.area || 'Unknown'} ${l.gpsLatitude ? `(GPS: ${l.gpsLatitude}, ${l.gpsLongitude})` : ''}
        </div>
      </div>
      <div class="detail-grid">
        <div class="detail-card"><div class="detail-card-title">Health Condition</div><div class="detail-card-value">${b.healthStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Vaccination</div><div class="detail-card-value">${b.vaccinationStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Sterilisation</div><div class="detail-card-value">${b.sterilisationStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Identification Marks</div><div class="detail-card-value">${b.identificationMarks || 'None'}</div></div>
      </div>
      ${mediaHtml ? `<h3 style="margin-top:24px;">Media Evidence</h3><div class="media-gallery">${mediaHtml}</div>` : ''}
      <div class="timeline">
        <h3 class="timeline-title">Event & Care History</h3>
        ${eventsHtml || '<p class="info-text">No recorded events yet.</p>'}
      </div>
    `;
  }

  function showLoading(active) {
    const el = document.getElementById('loadingOverlay');
    if (el) el.className = active ? 'loading-overlay active' : 'loading-overlay';
  }

  function loadSearchStats() {
    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success) return;
        const row = document.getElementById('statsDisplay');
        if (row) {
          row.innerHTML = `
            <div class="stat-card"><div class="stat-number">${res.animalsCount}</div><div class="stat-label">Animals Profiled</div></div>
            <div class="stat-card"><div class="stat-number">${res.eventsCount}</div><div class="stat-label">Events Logged</div></div>
            <div class="stat-card"><div class="stat-number">${res.areasCount}</div><div class="stat-label">Areas Covered</div></div>
            <div class="stat-card"><div class="stat-number">${res.percentLinked}%</div><div class="stat-label">With Photo Evidence</div></div>
          `;
        }
      })
      .apiGetSearchStats();
  }

  function loadProfiles() {
    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success) return;
        const container = document.getElementById('browseProfiles');
        if (!container) return;
        let html = '';
        res.profiles.forEach(p => {
          html += `
            <div class="detail-card" style="cursor:pointer;" onclick="document.getElementById('searchInput').value='${p.carProfileId}'; handleSearch();">
              <span class="profile-car-id">${p.carProfileId}</span>
              <h4>${p.animalName} (${p.animalType})</h4>
              <p class="info-text">Locality: ${p.area || 'Unknown'}</p>
            </div>
          `;
        });
        container.innerHTML = html;
      })
      .apiListProfiles();
  }
</script>
