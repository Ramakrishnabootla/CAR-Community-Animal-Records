<script>
  // Global state
  let uploadedFiles = [];
  let eventUploadedFiles = [];
  let profileRecords = {};

  // Page navigation
  function showPage(pageName) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(page => page.classList.remove('active'));

    const targetPage = document.getElementById(`page-${pageName}`);
    if (targetPage) {
      targetPage.classList.add('active');

      // Load stats when showing search page
      if (pageName === 'search') {
        loadSearchStats();
        loadProfiles();
      }
    }
  }

  // Conditional field logic for animal type
  function handleAnimalTypeChange(value) {
    const nativeDogField = document.getElementById('fieldNativeDogType');
    const nativeDogSelect = document.querySelector('[name="nativeDogType"]');
    const breedType = document.querySelector('[name="breedType"]');
    const breedOtherField = document.getElementById('fieldBreedOther');

    if (value === 'Dog') {
      nativeDogField.style.display = 'block';
      nativeDogSelect.required = true;
      breedType.required = true;
    } else if (value === 'Other') {
      nativeDogField.style.display = 'none';
      nativeDogSelect.required = false;
      breedType.required = false;
    } else {
      nativeDogField.style.display = 'none';
      nativeDogSelect.required = false;
      breedType.required = false;
    }
    breedOtherField.style.display = 'none';
  }

  function handleEventTypeChange(value) {
    const selectedEvent = value || document.getElementById('eventType')?.value || 'Vaccination or Preventive Care';
    const eventTypeInput = document.getElementById('eventType');
    if (eventTypeInput) eventTypeInput.value = selectedEvent;

    const panels = document.querySelectorAll('.event-detail-panel');
    panels.forEach(panel => {
      const isVisible = panel.dataset.eventPanel === selectedEvent;
      panel.style.display = isVisible ? 'block' : 'none';
      panel.querySelectorAll('input, select, textarea').forEach(input => {
        input.disabled = !isVisible;
        if (!isVisible) {
          if (input.type === 'checkbox') {
            input.checked = false;
          } else {
            input.value = '';
          }
        }
      });
    });

    const buttons = document.querySelectorAll('.event-kind-button');
    buttons.forEach(button => {
      const isActive = button.dataset.eventKind === selectedEvent;
      button.classList.toggle('active', isActive);
      button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
  }

  function setFormValue(selector, value) {
    const element = document.querySelector(selector);
    if (!element || value === null || value === undefined || value === '') return;
    const normalized = String(value).trim();
    if (element.tagName === 'SELECT') {
      const option = [...element.options].find(opt => opt.value.toLowerCase() === normalized.toLowerCase());
      if (option) {
        element.value = option.value;
      } else {
        element.value = normalized;
      }
    } else {
      element.value = normalized;
    }
  }

  function handleCaregiverChange(value) {
    const show = value === 'Yes';
    setFieldVisibility('fieldCaregiverWho', show);
    setFieldVisibility('fieldCareProvided', show);
    if (!show) {
      document.querySelector('[name="caregiverType"]').value = '';
      document.querySelector('[name="caregiverOtherDetails"]').value = '';
      document.querySelector('[name="careProvided"]').value = '';
      document.querySelector('[name="careOtherDetails"]').value = '';
      setFieldVisibility('fieldCaregiverOther', false);
      setFieldVisibility('fieldCareOther', false);
    }
  }

  function handleBreedTypeChange(value) {
    setFieldVisibility('fieldBreedOther', false);
  }

  function handleNativeBreedChange(value) {
    setFieldVisibility('fieldBreedOther', value === 'Other');
  }

  function handleCaregiverTypeChange(value) {
    setFieldVisibility('fieldCaregiverOther', value === 'Other');
  }

  function handleCareTypeChange(value) {
    setFieldVisibility('fieldCareOther', value === 'Other');
  }

  function setFieldVisibility(fieldId, visible) {
    const field = document.getElementById(fieldId);
    if (field) field.style.display = visible ? 'block' : 'none';
  }

  // File upload handling
  function handleFileSelect(event) {
    const files = event.target.files;
    const fileListDiv = document.getElementById('fileList');

    if (uploadedFiles.length + files.length > 5) {
      alert('Upload up to 5 files.');
      event.target.value = '';
      return;
    }

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      if (file.size > 10 * 1024 * 1024) {
        alert(file.name + ' exceeds the 10 MB limit.');
        continue;
      }

      // Convert file to base64
      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedFiles.push({
          filename: file.name,
          mimeType: file.type,
          base64Data: e.target.result
        });

        // Display file in list
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.innerHTML = `
          <span>${file.name}</span>
          <button type="button" class="btn-remove" onclick="removeFile('${file.name}')">Remove</button>
        `;
        fileListDiv.appendChild(fileItem);
      };
      reader.readAsDataURL(file);
    }

    // Clear input
    event.target.value = '';
  }

  function handleEventFileSelect(event) {
    const files = event.target.files;
    if (eventUploadedFiles.length + files.length > 5) { alert('Upload up to 5 files.'); event.target.value = ''; return; }
    Array.from(files).forEach(file => {
      if (file.size > 10 * 1024 * 1024) { alert(file.name + ' exceeds the 10 MB limit.'); return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        eventUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data: e.target.result });
        document.getElementById('eventFileList').insertAdjacentHTML('beforeend', '<div class="file-item"><span>' + file.name + '</span></div>');
      };
      reader.readAsDataURL(file);
    });
    event.target.value = '';
  }

  function removeFile(filename) {
    uploadedFiles = uploadedFiles.filter(f => f.filename !== filename);

    // Update display
    const fileListDiv = document.getElementById('fileList');
    const items = fileListDiv.querySelectorAll('.file-item');
    items.forEach(item => {
      if (item.textContent.includes(filename)) {
        item.remove();
      }
    });
  }

  // Form submission
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('profileForm');
    if (form) {
      form.addEventListener('submit', handleFormSubmit);
      const existingGuard = sessionStorage.getItem('carProfileCreatedSession');
      if (existingGuard === 'true') {
        const submitButton = form.querySelector('button[type="submit"]');
        if (submitButton) submitButton.disabled = true;
        showPage('home');
      }
    }
    const eventForm = document.getElementById('eventForm');
    if (eventForm) {
      eventForm.addEventListener('submit', handleEventSubmit);
      const eventTypeInput = eventForm.querySelector('[name="eventType"]');
      if (eventTypeInput && !eventTypeInput.value) eventTypeInput.value = 'Vaccination or Preventive Care';
      handleEventTypeChange(eventTypeInput ? eventTypeInput.value : 'Vaccination or Preventive Care');
      document.querySelectorAll('.event-kind-button').forEach(button => {
        button.addEventListener('click', function() {
          handleEventTypeChange(this.dataset.eventKind);
        });
      });
    }
  });

  function handleFormSubmit(event) {
    event.preventDefault();

    if (sessionStorage.getItem('carProfileCreatedSession') === 'true') {
      showPage('home');
      return;
    }

    const form = event.target;
    const formData = new FormData(form);

    // Build profile data object
    const profileData = {
      contributor: {
        name: formData.get('contributorName'),
        mobile: formData.get('contributorMobile'),
        email: formData.get('contributorEmail') || ''
      },
      animal: {
        animalType: formData.get('animalType'),
        nativeDogType: formData.get('nativeDogType') || '',
        breedType: formData.get('breedType') || '',
        breedOtherDetails: formData.get('breedOtherDetails') || '',
        animalName: formData.get('animalName') || '',
        sex: formData.get('sex') || 'Unknown',
        age: formData.get('age') || 'Unknown',
        caregiverAnswer: formData.get('caregiverAnswer') || '',
        caregiverType: formData.get('caregiverType') || '',
        caregiverOtherDetails: formData.get('caregiverOtherDetails') || '',
        careProvided: formData.get('careProvided') || '',
        careOtherDetails: formData.get('careOtherDetails') || ''
      },
      location: {
        area: formData.get('area'),
        landmark: formData.get('landmark') || '',
        usualLocationType: formData.get('usualLocationType') || '',
        state: formData.get('state') || '',
        city: formData.get('city') || '',
        gpsLocation: formData.get('gpsLocation') || '',
        seenRegularly: formData.get('seenRegularly') || ''
      },
      baselineStatus: {
        healthStatus: formData.get('healthStatus') || 'Unknown',
        vaccinationStatus: formData.get('vaccinationStatus') || 'Unknown',
        sterilisationStatus: formData.get('sterilisationStatus') || 'Unknown',
        behavior: formData.get('behavior') || '',
        abcStatus: formData.get('abcStatus') || '',
        abcOutcome: formData.get('abcOutcome') || '',
        identificationMarks: formData.get('identificationMarks') || '',
        identificationOtherDetails: formData.get('identificationOtherDetails') || '',
        additionalDetails: formData.get('additionalDetails') || ''
      },
      media: uploadedFiles
    };

    // Show loading
    showLoading(true);

    // Call server-side API
    google.script.run
      .withSuccessHandler(handleSaveSuccess)
      .withFailureHandler(handleSaveError)
      .apiSaveProfile(profileData);
  }

  function handleSaveSuccess(result) {
    showLoading(false);

    if (result.success) {
      sessionStorage.setItem('carProfileCreatedSession', 'true');
      const form = document.getElementById('profileForm');
      const submitButton = form ? form.querySelector('button[type="submit"]') : null;
      if (submitButton) submitButton.disabled = true;

      // Show success message
      const messageDiv = document.getElementById('formMessage');
      messageDiv.className = 'form-message success';
      messageDiv.innerHTML = `
        <h3>Profile Created Successfully!</h3>
        <p style="margin-top: 8px;">Animal Name: <strong>${document.querySelector('[name="animalName"]').value || 'Unknown'}</strong></p>
        <p style="margin-top: 4px;">CAR Profile ID: <strong style="color: var(--accent-red); font-family: monospace;">${result.carProfileId}</strong></p>
        <p style="margin-top: 12px; font-size: 14px;">A confirmation email has been sent if you provided an email address.</p>
      `;

      // Reset form
      form.reset();
      uploadedFiles = [];
      document.getElementById('fileList').innerHTML = '';
      showPage('home');
      messageDiv.scrollIntoView({ behavior: 'smooth' });
    } else {
      handleSaveError(result.error);
    }
  }

  function handleSaveError(error) {
    showLoading(false);

    const messageDiv = document.getElementById('formMessage');
    messageDiv.className = 'form-message error';
    messageDiv.innerHTML = `
      <h3>Error Creating Profile</h3>
      <p style="margin-top: 8px;">${error || 'An unexpected error occurred. Please try again.'}</p>
    `;

    messageDiv.scrollIntoView({ behavior: 'smooth' });
  }

  // Search functionality
  function handleSearch() {
    const searchInput = document.getElementById('searchInput');
    const query = searchInput.value.trim();

    if (!query) {
      alert('Please enter a CAR Profile ID to search');
      return;
    }

    showLoading(true);

    google.script.run
      .withSuccessHandler(handleRecordSearchSuccess)
      .withFailureHandler(handleSearchError)
      .apiSearchRecords(query);
  }

  function handleRecordSearchSuccess(result) {
    showLoading(false);
    if (!result.success) {
      handleSearchError(result.error);
      return;
    }
    if (result.found && result.profiles.length === 1) {
      openProfile(result.profiles[0].carProfileId);
      return;
    }
    const resultsDiv = document.getElementById('searchResults');
    result.profiles.forEach(profile => { profileRecords[profile.carProfileId] = profile.record; });
    resultsDiv.innerHTML = result.found ? result.profiles.map(profile => `
      <div class="search-result-card"><div><strong>${profile.animalName || 'Unknown'}</strong><div>${profile.animalType}</div><small>${profile.carProfileId}</small></div><button type="button" class="btn-secondary" data-profile-id="${profile.carProfileId}" onclick="goToRecords('${profile.carProfileId}')">Go to records</button></div>
    `).join('') : '<div class="form-message error"><h3>No matching records</h3><p>Try the exact CAR Profile ID, animal name, or area.</p></div>';
  }

  function displayRecordFromSearch(record) {
    try {
      displayProfile(record);
      showPage('profile');
    } catch (error) {
      handleSearchError('The record was found, but could not be displayed: ' + error.message);
    }
  }

  function handleSearchSuccess(result) {
    showLoading(false);

    if (result.success && result.found) {
      try {
        openDedicatedRecord(result.profile);
      } catch (error) {
        handleSearchError('The record was found, but could not be displayed: ' + error.message);
      }
    } else {
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = `
        <div class="form-message error">
          <h3>Profile Not Found</h3>
          <p style="margin-top: 8px;">No profile found with ID: <strong>${document.getElementById('searchInput').value}</strong></p>
          <p style="margin-top: 12px;">Please check the ID and try again, or create a new profile if this animal doesn't have one yet.</p>
        </div>
      `;
    }
  }

  function handleSearchError(error) {
    showLoading(false);
    const message = document.getElementById('searchResults');
    if (message) {
      message.innerHTML = '<div class="form-message error"><h3>Could not open this record</h3><p>' + escapeHtml(String(error)) + '</p></div>';
      message.scrollIntoView({ behavior: 'smooth' });
    } else {
      alert('Search error: ' + error);
    }
  }

  function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = value;
    return element.innerHTML;
  }

  function loadProfiles() {
    google.script.run.withSuccessHandler(function(result) {
      const browseProfiles = document.getElementById('browseProfiles');
      if (!result.success) {
        browseProfiles.innerHTML = '<p class="form-message error">Unable to load profiles: ' + result.error + '</p>';
        return;
      }
      profileRecords = {};
      browseProfiles.innerHTML = result.profiles.map(profile => `
        <div class="search-result-card" data-profile-id="${profile.carProfileId}" role="button" tabindex="0"><div><strong>${escapeHtml(profile.animalName || 'Unknown')}</strong><div>${escapeHtml(profile.animalType || 'Animal type unknown')} · ${escapeHtml(profile.area || 'Area unknown')}</div><small>${escapeHtml(profile.carProfileId)}</small></div><span class="btn-secondary">Go to records</span></div>
      `).join('') || '<p class="info-text">No profiles registered yet.</p>';
      browseProfiles.querySelectorAll('[data-profile-id]').forEach(element => {
        element.addEventListener('click', function(event) {
          event.preventDefault();
          event.stopPropagation();
          const profileId = this.getAttribute('data-profile-id');
          if (profileId) goToRecords(profileId);
        });
        element.addEventListener('keydown', function(event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            goToRecords(this.getAttribute('data-profile-id'));
          }
        });
      });
    }).withFailureHandler(function(error) {
      document.getElementById('browseProfiles').innerHTML = '<p class="form-message error">Unable to load profiles: ' + error + '</p>';
    }).apiListProfiles();
  }

  function openProfile(carProfileId) {
    const cleanId = String(carProfileId || '').trim();
    if (!cleanId) return;
    document.getElementById('searchInput').value = cleanId;
    showLoading(true);
    document.getElementById('searchResults').innerHTML = '<p class="info-text">Opening record ' + escapeHtml(cleanId) + '...</p>';
    google.script.run
      .withSuccessHandler(handleSearchSuccess)
      .withFailureHandler(handleSearchError)
      .apiSearchProfile(cleanId);
  }

  function goToRecords(carProfileId) {
    const cleanId = String(carProfileId || '').trim();
    openProfile(cleanId);
  }

  function openDedicatedRecord(record) {
    const loading = document.getElementById('recordLoading');
    const display = document.getElementById('recordDisplay');
    loading.style.display = 'block';
    display.innerHTML = '';
    showPage('record');
    try {
      displayProfile(record, display);
      loading.style.display = 'none';
    } catch (error) {
      loading.className = 'form-message error';
      loading.textContent = 'Could not load this record: ' + error.message;
    }
  }

  function openEventForm(carProfileId) {
    document.getElementById('eventCarProfileId').value = carProfileId;
    const eventForm = document.getElementById('eventForm');
    if (eventForm) {
      eventForm.reset();
      handleEventTypeChange('');
      google.script.run.withSuccessHandler(function(result) {
        if (result && result.success && result.profile) {
          const baseline = result.profile.baselineStatus || {};
          const healthConditionEl = eventForm.querySelector('[name="healthCondition"]');
          if (healthConditionEl) {
            healthConditionEl.value = '';
          }
          if (baseline && baseline.healthStatus && baseline.healthStatus !== 'Unknown') {
            const statusNote = eventForm.querySelector('[name="outcomeCurrentStatus"]');
            if (statusNote && !statusNote.value) {
              statusNote.value = 'Previous baseline health: ' + baseline.healthStatus;
            }
          }
        }
      }).apiSearchProfile(carProfileId);
    }
    showPage('event');
  }

  function getSelectedCheckboxValues(formData, key) {
    const selected = [];
    formData.forEach((value, formKey) => {
      if (formKey === key && value) {
        selected.push(String(value).trim());
      }
    });
    return selected.filter(Boolean).join(', ');
  }

  function handleEventSubmit(event) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const eventData = {};
    formData.forEach((value, key) => {
      if (key.endsWith('HealthCondition') || key.endsWith('Behaviour') || key.endsWith('Reason') || key.endsWith('SupportNeeded') || key.endsWith('IdentificationMarks') || key.endsWith('ProcedureActions')) {
        eventData[key] = eventData[key] ? eventData[key] + ', ' + value : value;
      } else if (key === 'eventType') {
        eventData[key] = value;
      } else if (!Object.prototype.hasOwnProperty.call(eventData, key)) {
        eventData[key] = value;
      }
    });

    eventData.medicalTreatmentHealthCondition = getSelectedCheckboxValues(formData, 'medicalTreatmentHealthCondition');
    eventData.medicalTreatmentBehaviour = getSelectedCheckboxValues(formData, 'medicalTreatmentBehaviour');
    eventData.medicalTreatmentReason = getSelectedCheckboxValues(formData, 'medicalTreatmentReason');
    eventData.medicalTreatmentSupportNeeded = getSelectedCheckboxValues(formData, 'medicalTreatmentSupportNeeded');
    eventData.sterilizationHealthCondition = getSelectedCheckboxValues(formData, 'sterilizationHealthCondition');
    eventData.sterilizationBehaviour = getSelectedCheckboxValues(formData, 'sterilizationBehaviour');
    eventData.sterilizationIdentificationMarks = getSelectedCheckboxValues(formData, 'sterilizationIdentificationMarks');
    eventData.sterilizationProcedureActions = getSelectedCheckboxValues(formData, 'sterilizationProcedureActions');

    const eventSpecificNarrative = [
      eventData.medicalTreatmentGiven,
      eventData.medicalTreatmentAdditionalDetails,
      eventData.sterilizationAdditionalDetails,
      eventData.sterilizationPerformedBy,
      eventData.sterilizationRecoveryStatus
    ].filter(value => value && String(value).trim()).join(' | ');

    if (eventSpecificNarrative) {
      eventData.eventOtherDetails = [eventData.eventOtherDetails, eventSpecificNarrative].filter(Boolean).join(' | ');
    }

    showLoading(true);
    google.script.run.withSuccessHandler(function(result) {
      showLoading(false);
      const message = document.getElementById('eventMessage');
      message.className = 'form-message ' + (result.success ? 'success' : 'error');
      message.innerHTML = result.success ? '<h3>Event saved</h3><p>Event ID: <strong>' + result.eventId + '</strong></p>' : '<h3>Event not saved</h3><p>' + result.error + '</p>';
      if (result.success) {
        event.target.reset();
        eventUploadedFiles = [];
        document.getElementById('eventFileList').innerHTML = '';
        document.getElementById('sterilizationFileList')?.replaceChildren();
        handleEventTypeChange('Vaccination or Preventive Care');
      }
      message.scrollIntoView({ behavior: 'smooth' });
    }).withFailureHandler(function(error) { showLoading(false); alert('Event save error: ' + error); }).apiSaveEvent({
      carProfileId: eventData.carProfileId,
      event: eventData,
      media: eventUploadedFiles
    });
  }

  // Load search statistics
  function loadSearchStats() {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          document.getElementById('statAnimals').textContent = result.animalsCount;
          document.getElementById('statEvents').textContent = result.eventsCount;
          document.getElementById('statAreas').textContent = result.areasCount;
          document.getElementById('statLinked').textContent = result.percentLinked + '%';
        }
      })
      .withFailureHandler(function(error) {
        console.error('Failed to load stats:', error);
      })
      .apiGetSearchStats();
  }

  // Display profile in detail view
  function displayProfile(profile, targetElement) {
    const animal = profile.animal;
    const contributor = profile.contributor;
    const location = profile.location;
    const baseline = profile.baselineStatus;
    const media = profile.media;
    const events = profile.events || [];

    // Generate avatar initials
    const name = animal.animalName || 'Unknown';
    const initials = name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();

    // Format timestamp
    const dateStr = new Date(animal.timestamp).toLocaleDateString('en-GB', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });

    // Build media grid HTML
    let mediaHTML = '';
    if (media && media.length > 0) {
      mediaHTML = '<div class="media-grid">';
      media.forEach(m => {
        mediaHTML += `
          <a href="${m.driveFileURL}" target="_blank" class="media-card">
            <div class="media-preview-box">📄</div>
            <div class="media-preview-name">${m.fileName}</div>
          </a>
        `;
      });
      mediaHTML += '</div>';
    } else {
      mediaHTML = '<p class="info-text">No photos uploaded</p>';
    }

    const html = `
      <div class="detail-layout">
        <div class="detail-left">
          <div class="detail-avatar-container">
            <div class="avatar-lg">${initials}</div>
            <span class="badge-active">Active</span>
          </div>

          <div class="detail-title">${name}</div>
          <div class="detail-subtitle">${animal.carProfileId}</div>

          <div class="details-grid">
            <div>
              <div class="detail-item-label">Sex</div>
              <div class="detail-item-value">${animal.sex || 'Unknown'}</div>
            </div>
            <div>
              <div class="detail-item-label">Estimated Age</div>
              <div class="detail-item-value">${animal.age || 'Unknown'}</div>
            </div>
            <div>
              <div class="detail-item-label">Animal Type</div>
              <div class="detail-item-value">${animal.animalType}</div>
            </div>
            <div>
              <div class="detail-item-label">Usual Area</div>
              <div class="detail-item-value">${location ? location.area : 'Unknown'}</div>
            </div>
          </div>

          <div class="profile-status-panel">
            <div class="timeline-title">Baseline status</div>
            <div class="details-grid">
              <div><div class="detail-item-label">Current health</div><div class="detail-item-value">${baseline ? baseline.healthStatus || 'Unknown' : 'Unknown'}</div></div>
              <div><div class="detail-item-label">Vaccinated</div><div class="detail-item-value">${baseline ? baseline.vaccinationStatus || 'Unknown' : 'Unknown'}</div></div>
              <div><div class="detail-item-label">Sterilised</div><div class="detail-item-value">${baseline ? baseline.sterilisationStatus || 'Unknown' : 'Unknown'}</div></div>
              <div><div class="detail-item-label">Behaviour</div><div class="detail-item-value">${baseline ? baseline.behavior || 'Unknown' : 'Unknown'}</div></div>
              <div><div class="detail-item-label">ABC status</div><div class="detail-item-value">${baseline ? baseline.abcStatus || 'Not recorded' : 'Not recorded'}</div></div>
              <div><div class="detail-item-label">ABC outcome</div><div class="detail-item-value">${baseline ? baseline.abcOutcome || 'Not recorded' : 'Not recorded'}</div></div>
              <div><div class="detail-item-label">Identification marks</div><div class="detail-item-value">${baseline ? baseline.identificationMarks || 'Unknown' : 'Unknown'}</div></div>
              <div><div class="detail-item-label">Other identification details</div><div class="detail-item-value">${baseline ? baseline.identificationOtherDetails || 'None' : 'None'}</div></div>
            </div>
            <div class="detail-item-label">Additional details</div>
            <div class="detail-item-value">${baseline ? baseline.additionalDetails || 'None' : 'None'}</div>
          </div>
        </div>

        <div class="detail-right">
          <div class="timeline-header">
            <div class="timeline-title">Continuous History</div>
            <button type="button" class="btn-primary" onclick="openEventForm('${animal.carProfileId}')">Create new event record</button>
          </div>

          <div class="timeline">
            <div class="timeline-event">
              <div class="event-date">${dateStr}</div>
              <div class="event-name">Profile created</div>
              <div class="event-desc">Baseline profile registered by ${contributor ? contributor.name : 'Unknown'}</div>
              <div class="event-desc" style="margin-top: 8px;">
                <strong>Health:</strong> ${baseline ? baseline.healthStatus : 'Unknown'} |
                <strong>Vaccination:</strong> ${baseline ? baseline.vaccinationStatus : 'Unknown'} |
                <strong>Sterilisation:</strong> ${baseline ? baseline.sterilisationStatus : 'Unknown'}
              </div>
              ${mediaHTML}
            </div>
            ${events.map(event => `<div class="timeline-event"><div class="event-date">${event.dateOfEvent || event.dateReported || 'Date unknown'}</div><div class="event-name">${event.eventType}</div><div class="event-desc">${event.eventDescription || event.outcomeCurrentStatus || 'Event recorded'}</div><div class="event-desc"><strong>Health:</strong> ${event.healthCondition || 'Unknown'} | <strong>Vaccinated:</strong> ${event.vaccinated || 'Unknown'} | <strong>Sterilised:</strong> ${event.sterilised || 'Unknown'}</div></div>`).join('')}
          </div>
        </div>
      </div>
    `;

    (targetElement || document.getElementById('profileDisplay')).innerHTML = html;
  }

  // Loading overlay
  function showLoading(show) {
    const overlay = document.getElementById('loadingOverlay');
    if (show) {
      overlay.classList.add('active');
    } else {
      overlay.classList.remove('active');
    }
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    showPage('home');
    const browseProfiles = document.getElementById('browseProfiles');
    if (browseProfiles) {
      browseProfiles.addEventListener('click', function(event) {
        const button = event.target.closest('[data-profile-id]');
        if (button) goToRecords(button.getAttribute('data-profile-id'));
      });
    }
  });
</script>
