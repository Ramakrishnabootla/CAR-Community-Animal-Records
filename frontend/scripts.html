<script>
  // Global application state
  let uploadedFiles = [];
  let sbcUploadedFiles = [];
  let eventUploadedFiles = [];
  let sterilizationUploadedFiles = [];
  let isSubmitting = false;
  let cachedPendingHolds = [];

  // --- 1. Page Navigation --------------------------------------------------------
  function showPage(pageName) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(page => page.classList.remove('active'));

    const targetPage = document.getElementById(`page-${pageName}`);
    if (targetPage) {
      targetPage.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (pageName === 'search') {
        loadSearchStats();
        loadProfiles();
      } else if (pageName === 'admin') {
        loadAdminHolds();
      } else if (pageName === 'event') {
        switchEventTab('Vaccination or Preventive Care');
      }
    }
  }

  // --- 2. Geolocation Helpers (Mandatory GPS across all forms) -------------------
  function getSbcGPSLocation() {
    captureGPS('sbcGpsCoordinates', null, null, null, 'sbcGpsStatusDisplay');
  }

  function getContributorGPSLocation() {
    captureGPS('gpsCoordinates', 'gpsLatitude', 'gpsLongitude', 'gpsCapturedMethod', 'gpsStatusDisplay');
  }

  function getEventGPSLocation() {
    captureGPS('eventGpsCoordinates', null, null, null, 'eventGpsStatusDisplay');
  }

  function captureGPS(coordInputId, latInputId, lngInputId, methodInputId, statusDisplayId) {
    const coordInput = document.getElementById(coordInputId);
    const latInput = latInputId ? document.getElementById(latInputId) : null;
    const lngInput = lngInputId ? document.getElementById(lngInputId) : null;
    const methodInput = methodInputId ? document.getElementById(methodInputId) : null;
    const statusEl = statusDisplayId ? document.getElementById(statusDisplayId) : null;

    if (!navigator.geolocation) {
      alert('Geolocation is not supported by your browser. Please enter latitude, longitude manually.');
      return;
    }

    if (coordInput) coordInput.placeholder = 'GPS: Requesting location...';
    if (statusEl) statusEl.innerHTML = '<span style="color:#2D7A5F;">📍 Requesting location permission...</span>';

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = Math.round(position.coords.accuracy);

        if (coordInput) coordInput.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        if (latInput) latInput.value = lat;
        if (lngInput) lngInput.value = lng;
        if (methodInput) methodInput.value = 'Device GPS';
        if (statusEl) {
          statusEl.innerHTML = `<span style="color:#137333; font-weight:600;">✅ GPS Captured: ${lat.toFixed(5)}, ${lng.toFixed(5)} (+/-${accuracy}m)</span>`;
        }
      },
      (error) => {
        console.warn('GPS error:', error.message);
        if (coordInput) coordInput.placeholder = 'Latitude, Longitude (e.g. 17.38504, 78.48667)';
        if (methodInput) methodInput.value = 'Manual Entry';
        if (statusEl) {
          statusEl.innerHTML = '<span style="color:#c5221f;">⚠️ Could not get device GPS: ' + error.message + '. Please enter coordinates manually.</span>';
        }
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  }

  // --- 3. Image URL Resolution --------------------------------------------------
  function getDirectDriveImageUrl(fileIdOrUrl) {
    if (!fileIdOrUrl) return '';
    const str = String(fileIdOrUrl).trim();
    if (str.startsWith('data:image')) return str;
    let fileId = str;
    if (str.includes('id=')) {
      fileId = str.split('id=')[1].split('&')[0];
    } else if (str.includes('/d/')) {
      fileId = str.split('/d/')[1].split('/')[0];
    }
    if (/^[a-zA-Z0-9_-]{20,}$/.test(fileId)) {
      return 'https://lh3.googleusercontent.com/d/' + fileId;
    }
    return str;
  }

  // --- 4. Search-Before-Create (Step 1) -----------------------------------------
  function handleSbcAnimalTypeChange(val) {
    const field = document.getElementById('sbcFieldNativeDog');
    if (field) field.style.display = (val === 'Dog') ? '' : 'none';
  }

  function handleSbcBreedTypeChange(val) {
    const field = document.getElementById('sbcFieldNativeDog');
    const animalType = document.getElementById('sbcAnimalType')?.value;
    if (field) {
      field.style.display = (animalType === 'Dog' && val === 'Indie / Native') ? '' : 'none';
    }
  }

  function handleSbcPhotoSelect(event) {
    const files = Array.from(event.target.files);
    const previewEl = document.getElementById('sbcPhotoPreview');
    if (previewEl) previewEl.innerHTML = '';
    sbcUploadedFiles = [];

    for (const file of files) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Data = e.target.result;
        sbcUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data, visibility: 'Restricted', source: 'Self-reported' });
        if (previewEl) {
          previewEl.innerHTML += `
            <div style="display:inline-block; margin-right:8px; text-align:center;">
              <img src="${base64Data}" style="width:80px; height:80px; object-fit:cover; border-radius:6px; border:2px solid #2D7A5F;" />
              <div style="font-size:11px; color:#555; max-width:80px; overflow:hidden; text-overflow:ellipsis;">${file.name}</div>
            </div>
          `;
        }
      };
      reader.readAsDataURL(file);
    }
  }

  function handleSearchBeforeCreate() {
    // Hide previous success or result containers
    const successContainer = document.getElementById('profileSuccessContainer');
    if (successContainer) successContainer.innerHTML = '';

    const name = document.getElementById('sbcContributorName')?.value?.trim();
    const mobile = document.getElementById('sbcContributorMobile')?.value?.trim();
    const animalType = document.getElementById('sbcAnimalType')?.value?.trim();
    const sex = document.getElementById('sbcSex')?.value?.trim();
    const age = document.getElementById('sbcAge')?.value?.trim();
    const breedType = document.getElementById('sbcBreedType')?.value?.trim();
    const area = document.getElementById('sbcArea')?.value?.trim();
    const gps = document.getElementById('sbcGpsCoordinates')?.value?.trim();
    const health = document.getElementById('sbcHealthStatus')?.value?.trim();
    const behavior = document.getElementById('sbcBehavior')?.value?.trim();
    const marks = document.getElementById('sbcIdentificationMarks')?.value?.trim();
    const animalName = document.getElementById('sbcAnimalName')?.value?.trim();

    // Validation checks for mandatory fields
    if (!name || name.length < 2) {
      alert('Please enter your name (Contributor Name, minimum 2 characters).');
      document.getElementById('sbcContributorName')?.focus();
      return;
    }
    if (!mobile || !/^[0-9]{10}$|^[0-9]{12}$/.test(mobile.replace(/[\s\-+]/g, ''))) {
      alert('Please enter a valid 10-digit mobile number.');
      document.getElementById('sbcContributorMobile')?.focus();
      return;
    }
    if (!animalType) {
      alert('Please select Animal Type.');
      document.getElementById('sbcAnimalType')?.focus();
      return;
    }
    if (!sex) {
      alert('Please select Gender / Sex.');
      document.getElementById('sbcSex')?.focus();
      return;
    }
    if (!age) {
      alert('Please select Approximate Age.');
      document.getElementById('sbcAge')?.focus();
      return;
    }
    if (!breedType) {
      alert('Please select Breed Type.');
      document.getElementById('sbcBreedType')?.focus();
      return;
    }
    if (!marks) {
      alert('Please enter Identification Marks or description.');
      document.getElementById('sbcIdentificationMarks')?.focus();
      return;
    }
    if (!area) {
      alert('Please enter Area / Locality.');
      document.getElementById('sbcArea')?.focus();
      return;
    }
    if (!gps) {
      alert('GPS Location is mandatory. Please click "📍 Capture Location" or enter coordinates manually.');
      document.getElementById('sbcGpsCoordinates')?.focus();
      return;
    }

    const resultsContainer = document.getElementById('searchBeforeCreateResults');
    resultsContainer.innerHTML = '<div style="padding:16px; color:#2D7A5F; font-weight:600;">🔍 Searching candidate profiles in ' + area + '...</div>';
    resultsContainer.style.display = 'block';

    google.script.run
      .withSuccessHandler((response) => {
        if (!response || !response.success) {
          const errMsg = (response && response.error) ? response.error : 'Search failed or returned empty response.';
          resultsContainer.innerHTML = `<div class="form-message error">${errMsg}</div>`;
          return;
        }

        if (!response.matchesFound || response.candidates.length === 0) {
          resultsContainer.innerHTML = `
            <div style="background:#E6F4EA; border:1px solid #C2E7CD; padding:18px; border-radius:10px; margin-bottom:16px;">
              <strong style="color:#137333; font-size:16px;">✅ No Matching Animal Found in "${area}"!</strong>
              <p style="margin-top:6px; color:#333; font-size:14px;">All required details are complete. You can create the new profile immediately or review additional fields.</p>
              <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
                <button type="button" class="btn-primary" style="padding:10px 22px; font-weight:700;" onclick="handleDirectCreateFromSbc()">
                  🎉 Save & Create Profile Now
                </button>
                <button type="button" class="btn-secondary" onclick="selectDifferentAnimal()">
                  Edit / Add Optional Details First
                </button>
              </div>
            </div>
          `;
          autoFillProfileFormFromSbc();
          return;
        }

        // Render Match Comparison Cards with Side-by-Side Verification
        let userPhotoHtml = '';
        if (sbcUploadedFiles.length > 0 && sbcUploadedFiles[0].base64Data) {
          userPhotoHtml = `
            <div style="background:#f9f9f9; border:1px solid #ddd; padding:12px; border-radius:8px; margin-bottom:14px; text-align:center;">
              <strong style="font-size:13px; color:#555;">📸 Your Submitted Photo (Side-by-Side Comparison)</strong><br>
              <img src="${sbcUploadedFiles[0].base64Data}" style="max-height:140px; max-width:100%; border-radius:6px; margin-top:6px;" />
            </div>
          `;
        }

        let html = `
          <div style="background:#FFF3E0; border:1px solid #FFE0B2; padding:16px; border-radius:8px; margin-bottom:16px;">
            <strong style="color:#D97706; font-size:16px;">⚠️ Potential Candidate Matches Found in ${area}!</strong>
            <p style="font-size:14px; margin-top:4px; color:#555;">Compare candidate details side-by-side before deciding whether to append an event, place on hold for review, or create a new profile.</p>
          </div>
          ${userPhotoHtml}
          <div class="match-card-grid">
        `;

        response.candidates.forEach(c => {
          const isHigh = c.matchScore >= 70;
          const directImgUrl = getDirectDriveImageUrl(c.driveFileURL);
          html += `
            <div class="match-card ${isHigh ? 'high-match' : 'med-match'}" style="background:#fff; border:1px solid #ddd; border-radius:8px; padding:16px;">
              <span class="match-score-badge" style="background:${isHigh ? '#c5221f' : '#f59e0b'}; color:#fff; padding:3px 8px; border-radius:4px; font-size:12px; font-weight:700;">${c.matchScore}% Match</span>
              <h4 style="margin:10px 0 6px 0; color:#2D7A5F;">${c.animalName || 'Unknown'} (${c.carProfileId})</h4>
              <p style="margin:4px 0;"><strong>Type:</strong> ${c.animalType} | <strong>Sex:</strong> ${c.sex}</p>
              <p style="margin:4px 0;"><strong>Locality:</strong> ${c.area}</p>
              <p style="margin:4px 0;"><strong>Marks:</strong> ${c.identificationMarks || 'None'}</p>
              ${directImgUrl ? `<img src="${directImgUrl}" class="media-thumb" style="margin-top:8px; width:100%; max-height:150px; object-fit:cover; border-radius:6px;" />` : ''}
              
              <div class="match-actions" style="margin-top:14px; display:flex; flex-direction:column; gap:8px;">
                <button type="button" class="btn-primary" style="background:#137333; font-size:13px;" onclick="selectSameAnimal('${c.carProfileId}', '${c.animalName || 'Animal'}')">
                  ✅ Same Animal (Add Event to History)
                </button>
                <button type="button" class="btn-secondary" style="background:#fef3c7; color:#92400e; border-color:#fde68a; font-size:13px;" onclick="selectNotSure('${c.carProfileId}', ${c.matchScore})">
                  ❓ Not Sure (Hold for Admin Review)
                </button>
              </div>
            </div>
          `;
        });

        html += `
          </div>
          <div style="margin-top:20px; text-align:center; padding:16px; background:#f9f9f9; border-radius:8px;">
            <p style="margin-bottom:10px; font-weight:600; color:#374151;">None of these match your animal?</p>
            <button type="button" class="btn-primary" onclick="handleDirectCreateFromSbc()">
              🐾 Different Animal — Proceed & Create Profile
            </button>
          </div>
        `;

        resultsContainer.innerHTML = html;
      })
      .withFailureHandler((err) => {
        resultsContainer.innerHTML = `<div class="form-message error">Search Error: ${err.message}</div>`;
      })
      .apiSearchBeforeCreate({ animalType, area, animalName, sex, breedType, identificationMarks: marks });
  }

  function autoFillProfileFormFromSbc() {
    const setVal = (name, val) => {
      if (!val) return;
      const el = document.querySelector(`[name="${name}"]`);
      if (el) el.value = val;
    };

    setVal('contributorName', document.getElementById('sbcContributorName')?.value);
    setVal('contributorMobile', document.getElementById('sbcContributorMobile')?.value);
    setVal('contributorEmail', document.getElementById('sbcContributorEmail')?.value);

    setVal('animalType', document.getElementById('sbcAnimalType')?.value);
    setVal('area', document.getElementById('sbcArea')?.value);
    setVal('animalName', document.getElementById('sbcAnimalName')?.value);
    setVal('sex', document.getElementById('sbcSex')?.value);
    setVal('age', document.getElementById('sbcAge')?.value);
    setVal('breedType', document.getElementById('sbcBreedType')?.value);
    setVal('nativeDogType', document.getElementById('sbcNativeDogType')?.value);

    const caregiverAnswer = document.getElementById('sbcCaregiverAnswer')?.value || 'Yes';
    setVal('caregiverAnswer', caregiverAnswer);

    const sbcCaregiverType = document.getElementById('sbcCaregiverType')?.value;
    if (sbcCaregiverType) {
      setVal('caregiverType', sbcCaregiverType);
      const caregiverWhoEl = document.getElementById('fieldCaregiverWho');
      if (caregiverWhoEl) caregiverWhoEl.style.display = '';
    }

    setVal('healthStatus', document.getElementById('sbcHealthStatus')?.value);
    setVal('behavior', document.getElementById('sbcBehavior')?.value);
    setVal('identificationMarks', document.getElementById('sbcIdentificationMarks')?.value);
    setVal('seenRegularly', document.getElementById('sbcSeenRegularly')?.value);
    setVal('landmark', document.getElementById('sbcLandmark')?.value);

    const sbcGps = document.getElementById('sbcGpsCoordinates')?.value;
    if (sbcGps) {
      const gpsInput = document.getElementById('gpsCoordinates');
      if (gpsInput) gpsInput.value = sbcGps;
    }

    if (sbcUploadedFiles && sbcUploadedFiles.length > 0) {
      uploadedFiles = [...sbcUploadedFiles];
    }
  }

  function selectSameAnimal(carProfileId, animalName) {
    if (confirm(`Open Add Event form to append event history for ${animalName} (${carProfileId})?`)) {
      showPage('event');
      document.getElementById('eventCarProfileId').value = carProfileId;
    }
  }

  function selectDifferentAnimal() {
    autoFillProfileFormFromSbc();
    const fullFormSection = document.getElementById('fullProfileFormSection');
    if (fullFormSection) {
      fullFormSection.style.display = 'block';
      fullFormSection.scrollIntoView({ behavior: 'smooth' });
    }
    const resultsContainer = document.getElementById('searchBeforeCreateResults');
    if (resultsContainer) resultsContainer.style.display = 'none';
  }

  function selectNotSure(matchedCarProfileId, matchScore) {
    if (!confirm('Flag submission on HOLD for Admin side-by-side review?')) return;

    autoFillProfileFormFromSbc();
    const data = gatherProfileFormData();
    if (sbcUploadedFiles.length > 0 && (!data.media || data.media.length === 0)) {
      data.media = sbcUploadedFiles;
    }

    showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        showLoading(false);
        if (res && res.success) {
          const successContainer = document.getElementById('profileSuccessContainer');
          if (successContainer) {
            successContainer.innerHTML = `
              <div class="success-banner-card info-theme">
                <div class="success-header-row">
                  <span class="success-icon-badge">📋</span>
                  <h3 class="success-title">Submission Placed on Hold for Admin Review!</h3>
                </div>
                <p class="success-desc">
                  Because potential candidate matches exist in your area, your animal record has been placed on <strong>Hold (ID: ${res.holdId})</strong> for side-by-side administrative review. No duplicates will be created.
                </p>
                <div class="car-id-box">
                  <span>Hold Reference ID:</span>
                  <strong>${res.holdId}</strong>
                  <button type="button" class="btn-copy" onclick="copyToClipboard('${res.holdId}')">📋 Copy ID</button>
                </div>
                <div class="success-actions">
                  <button type="button" class="btn-primary" onclick="showPage('search')">Return to Search</button>
                  <button type="button" class="btn-secondary" onclick="resetCreateForm()">Create Another Record</button>
                </div>
              </div>
            `;
            successContainer.scrollIntoView({ behavior: 'smooth' });
          }
          const resultsContainer = document.getElementById('searchBeforeCreateResults');
          if (resultsContainer) resultsContainer.style.display = 'none';
        } else {
          alert('Error: ' + ((res && res.error) || 'Failed to submit hold.'));
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        alert('Server Error: ' + err.message);
      })
      .apiSaveUncertainMatch({
        matchedCarProfileId: matchedCarProfileId,
        matchScore: matchScore,
        submittedData: data
      });
  }

  function handleDirectCreateFromSbc() {
    autoFillProfileFormFromSbc();
    const data = gatherProfileFormData();
    if (sbcUploadedFiles.length > 0 && (!data.media || data.media.length === 0)) {
      data.media = sbcUploadedFiles;
    }

    submitProfileData(data);
  }

  // --- 5. Conditional Field Handlers (Profile Form) ---------------------------
  function handleAnimalTypeChange(val) {
    const nativeField = document.getElementById('fieldNativeDogType');
    if (nativeField) nativeField.style.display = (val === 'Dog') ? '' : 'none';
  }

  function handleNativeBreedChange(val) {
    const otherField = document.getElementById('fieldBreedOther');
    if (otherField) otherField.style.display = (val === 'Other') ? '' : 'none';
  }

  function handleBreedTypeChange(val) {
    const otherField = document.getElementById('fieldBreedOther');
    if (otherField) otherField.style.display = (val === 'Other') ? '' : 'none';
  }

  function handleCaregiverChange(val) {
    const who = document.getElementById('fieldCaregiverWho');
    const care = document.getElementById('fieldCareProvided');
    if (who) who.style.display = (val === 'Yes') ? '' : 'none';
    if (care) care.style.display = (val === 'Yes') ? '' : 'none';
  }

  function handleCaregiverTypeChange(val) {
    const other = document.getElementById('fieldCaregiverOther');
    if (other) other.style.display = (val === 'Other') ? '' : 'none';
  }

  function handleCareTypeChange(val) {
    const other = document.getElementById('fieldCareOther');
    if (other) other.style.display = (val === 'Other') ? '' : 'none';
  }

  function handleFileSelect(event) {
    const files = Array.from(event.target.files);
    uploadedFiles = [];
    const fileListEl = document.getElementById('fileList');
    if (fileListEl) fileListEl.innerHTML = '';

    for (const file of files) {
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data: e.target.result, visibility: 'Restricted', source: 'Self-reported' });
        if (fileListEl) fileListEl.innerHTML += `<div>Uploaded: ${file.name}</div>`;
      };
      reader.readAsDataURL(file);
    }
  }

  function handleEventFileSelect(event) {
    const files = Array.from(event.target.files);
    eventUploadedFiles = [];
    const listEl = document.getElementById('eventFileList');
    if (listEl) listEl.innerHTML = '';

    for (const file of files) {
      const reader = new FileReader();
      reader.onload = (e) => {
        eventUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data: e.target.result, visibility: 'Restricted', source: 'Self-reported' });
        if (listEl) listEl.innerHTML += `<div>Attached: ${file.name}</div>`;
      };
      reader.readAsDataURL(file);
    }
  }

  function handleSterilizationFileSelect(event) {
    const files = Array.from(event.target.files);
    sterilizationUploadedFiles = [];
    const listEl = document.getElementById('sterilizationFileList');
    if (listEl) listEl.innerHTML = '';

    for (const file of files) {
      const reader = new FileReader();
      reader.onload = (e) => {
        sterilizationUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data: e.target.result, visibility: 'Restricted', source: 'Self-reported' });
        if (listEl) listEl.innerHTML += `<div>Attached: ${file.name}</div>`;
      };
      reader.readAsDataURL(file);
    }
  }

  // --- 6. Data Gathering & Profile Submission ----------------------------------
  function gatherProfileFormData() {
    const getVal = (selector, fallback = '') => {
      const el = document.querySelector(selector);
      return el ? el.value.trim() : fallback;
    };
    const getById = (id, fallback = '') => {
      const el = document.getElementById(id);
      return el ? el.value.trim() : fallback;
    };

    const contributorName = getVal('[name="contributorName"]') || getById('sbcContributorName', '');
    const contributorMobile = getVal('[name="contributorMobile"]') || getById('sbcContributorMobile', '');
    const contributorEmail = getVal('[name="contributorEmail"]') || getById('sbcContributorEmail', '');

    const animalType = getVal('[name="animalType"]') || getById('sbcAnimalType', 'Dog');
    const animalName = getVal('[name="animalName"]') || getById('sbcAnimalName', 'Unknown');
    const sex = getVal('[name="sex"]') || getById('sbcSex', 'Unknown');
    const age = getVal('[name="age"]') || getById('sbcAge', 'Unknown');
    const breedType = getVal('[name="breedType"]') || getById('sbcBreedType', 'Indie / Native');
    const nativeDogType = getVal('[name="nativeDogType"]') || getById('sbcNativeDogType', '');
    const caregiverAnswer = getVal('[name="caregiverAnswer"]') || getById('sbcCaregiverAnswer', 'Yes');
    const caregiverType = getVal('[name="caregiverType"]') || getById('sbcCaregiverType', 'Individual');

    const area = getVal('[name="area"]') || getById('sbcArea', '');
    const gpsCoordinates = getById('gpsCoordinates') || getById('sbcGpsCoordinates', '');
    const seenRegularly = getVal('[name="seenRegularly"]') || getById('sbcSeenRegularly', 'Yes. Seen often');
    const landmark = getVal('[name="landmark"]') || getById('sbcLandmark', '');

    const healthStatus = getVal('[name="healthStatus"]') || getById('sbcHealthStatus', 'Healthy');
    const behavior = getVal('[name="behavior"]') || getById('sbcBehavior', 'Friendly');
    const identificationMarks = getVal('[name="identificationMarks"]') || getById('sbcIdentificationMarks', 'None visible');

    return {
      contributor: {
        name: contributorName,
        mobile: contributorMobile,
        email: contributorEmail
      },
      animal: {
        animalType: animalType,
        animalName: animalName || 'Unknown',
        sex: sex,
        age: age,
        breedType: breedType,
        nativeDogType: nativeDogType,
        breedOtherDetails: getVal('[name="breedOtherDetails"]'),
        caregiverAnswer: caregiverAnswer,
        caregiverType: caregiverType,
        caregiverOtherDetails: getVal('[name="caregiverOtherDetails"]'),
        careProvided: getVal('[name="careProvided"]', 'Food and water'),
        careOtherDetails: getVal('[name="careOtherDetails"]')
      },
      location: {
        area: area,
        city: getVal('[name="city"]', 'Hyderabad'),
        state: getVal('[name="state"]', 'Telangana'),
        usualLocationType: getVal('[name="usualLocationType"]', 'Residential area'),
        landmark: landmark,
        gpsCoordinates: gpsCoordinates,
        gpsLatitude: getById('gpsLatitude'),
        gpsLongitude: getById('gpsLongitude'),
        gpsCapturedMethod: getById('gpsCapturedMethod', 'Device GPS'),
        seenRegularly: seenRegularly
      },
      baselineStatus: {
        healthStatus: healthStatus,
        vaccinationStatus: getVal('[name="vaccinationStatus"]', 'Unknown'),
        sterilisationStatus: getVal('[name="sterilisationStatus"]', 'Unknown'),
        behavior: behavior,
        abcStatus: getVal('[name="abcStatus"]', ''),
        abcOutcome: getVal('[name="abcOutcome"]', ''),
        identificationMarks: identificationMarks,
        identificationOtherDetails: getVal('[name="identificationOtherDetails"]'),
        additionalDetails: getVal('[name="additionalDetails"]')
      },
      media: uploadedFiles.length > 0 ? uploadedFiles : sbcUploadedFiles
    };
  }

  function handleProfileSubmit(e) {

  // --- 7. Event Tab Switching & Event Submission --------------------------------
  function switchEventTab(kind) {
    const typeInput = document.getElementById('eventType');
    if (typeInput) typeInput.value = kind;

    // Update button active styling
    const buttons = document.querySelectorAll('.event-kind-button');
    buttons.forEach(btn => {
      const isMatch = (btn.dataset.eventKind === kind) || (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(kind));
      if (isMatch) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // Toggle panel visibility and dynamically enable/disable inputs
    // (Disabled inputs are excluded from HTML5 browser validation, preventing "element not focusable" errors)
    document.querySelectorAll('.event-detail-panel').forEach(panel => {
      const isActive = panel.dataset.eventPanel === kind;
      panel.style.display = isActive ? 'block' : 'none';
      panel.querySelectorAll('input, select, textarea').forEach(input => {
        input.disabled = !isActive;
      });
    });
  }

  function handleEventSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (isSubmitting) return;

    const form = document.getElementById('eventForm');
    const carProfileId = document.getElementById('eventCarProfileId')?.value?.trim();

    if (!carProfileId) {
      alert('Please select or search for an existing animal CAR Profile ID first.');
      showPage('search');
      return;
    }

    const gpsCoordinates = document.getElementById('eventGpsCoordinates')?.value?.trim();
    if (!gpsCoordinates) {
      alert('GPS Location is mandatory. Please click "📍 Capture Location" or enter coordinates.');
      document.getElementById('eventGpsCoordinates')?.focus();
      return;
    }

    const activePanel = document.querySelector('.event-kind-button.active')?.dataset?.eventKind || document.getElementById('eventType')?.value || 'Vaccination or Preventive Care';
    const mediaFiles = activePanel === 'Sterilization' ? sterilizationUploadedFiles : eventUploadedFiles;

    const getVal = (selector, fallback = '') => {
      const el = form ? form.querySelector(selector) : null;
      return el ? el.value.trim() : fallback;
    };
    const getChecked = (name) => {
      if (!form) return '';
      return Array.from(form.querySelectorAll(`[name="${name}"]:checked`)).map(cb => cb.value).join(', ');
    };

    let eventPayload = {
      eventType: activePanel,
      googleLocationPin: gpsCoordinates,
      datePrecision: getVal('#eventDatePrecision', 'Exact'),
      source: getVal('#eventSource', 'Self-reported'),
      verificationStatus: getVal('#eventVerificationStatus', 'Unverified')
    };

    if (activePanel === 'Vaccination or Preventive Care') {
      const pType = getVal('[name="preventiveCareType"]');
      const givenBy = getVal('[name="preventiveCareGivenBy"]');
      if (!pType) {
        alert('Please select the Type of Preventive Care.');
        form.querySelector('[name="preventiveCareType"]')?.focus();
        return;
      }
      if (!givenBy) {
        alert('Please enter who provided or administered the care.');
        form.querySelector('[name="preventiveCareGivenBy"]')?.focus();
        return;
      }

      eventPayload = {
        ...eventPayload,
        eventCategory: pType,
        eventOtherDetails: getVal('[name="preventiveCareOtherDetails"]'),
        dateOfEvent: getVal('[name="preventiveCareDate"]', new Date().toISOString().split('T')[0]),
        organisationOrPerson: givenBy,
        additionalDetails: getVal('[name="vaccineProductName"]'),
        eventDescription: `Preventive care (${pType}) administered by ${givenBy}`
      };
    } else if (activePanel === 'Medical Treatment') {
      const tDate = getVal('[name="medicalTreatmentDate"]');
      if (!tDate) {
        alert('Please enter the Date of treatment.');
        form.querySelector('[name="medicalTreatmentDate"]')?.focus();
        return;
      }

      eventPayload = {
        ...eventPayload,
        dateOfEvent: tDate,
        healthCondition: getChecked('medicalTreatmentHealthCondition') || 'Under Treatment',
        behaviour: getChecked('medicalTreatmentBehaviour'),
        eventCategory: getChecked('medicalTreatmentReason') || 'Medical Treatment',
        eventDescription: getVal('[name="medicalTreatmentGiven"]') || 'Medical treatment administered',
        organisationOrPerson: getVal('[name="medicalTreatmentProvidedBy"]'),
        additionalDetails: getVal('[name="medicalTreatmentAdditionalDetails"]')
      };
    } else if (activePanel === 'Sterilization') {
      eventPayload = {
        ...eventPayload,
        dateReported: getVal('[name="sterilizationDateReported"]', new Date().toISOString().split('T')[0]),
        healthCondition: getChecked('sterilizationHealthCondition'),
        behaviour: getChecked('sterilizationBehaviour'),
        vaccinated: getVal('[name="sterilizationVaccinated"]', 'Unknown'),
        sterilised: getVal('[name="sterilizationStatus"]', 'Yes'),
        identificationMarks: getChecked('sterilizationIdentificationMarks'),
        eventCategory: getChecked('sterilizationProcedureActions') || 'Sterilization Surgery',
        dateOfEvent: getVal('[name="sterilizationProcedureDate"]', getVal('[name="sterilizationDateReported"]')),
        organisationOrPerson: getVal('[name="sterilizationPerformedBy"]'),
        outcomeCurrentStatus: getVal('[name="sterilizationRecoveryStatus"]', 'Recovering Well'),
        additionalDetails: getVal('[name="sterilizationAdditionalDetails"]'),
        eventDescription: 'Sterilization / ABC procedure'
      };
    }

    const submitBtn = form ? form.querySelector('button[type="submit"]') : null;
    if (submitBtn) { submitBtn.disabled = true; submitBtn.innerText = 'Saving Event...'; }
    isSubmitting = true;
    showLoading(true);

    const successContainer = document.getElementById('eventSuccessContainer');

    google.script.run
      .withSuccessHandler((res) => {
        showLoading(false);
        isSubmitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = 'Save Event'; }

        if (res && res.success) {
          eventUploadedFiles = [];
          sterilizationUploadedFiles = [];
          if (form) form.reset();

          if (successContainer) {
            successContainer.innerHTML = `
              <div class="success-banner-card">
                <div class="success-header-row">
                  <span class="success-icon-badge">✅</span>
                  <h3 class="success-title">Event Recorded Successfully!</h3>
                </div>
                <p class="success-desc">
                  <strong>${activePanel}</strong> has been appended to continuing history for <strong>${carProfileId}</strong>.
                </p>
                <div class="car-id-box">
                  <span>Event Reference ID:</span>
                  <strong>${res.eventId}</strong>
                  <button type="button" class="btn-copy" onclick="copyToClipboard('${res.eventId}')">📋 Copy ID</button>
                </div>
                <div class="success-actions">
                  <button type="button" class="btn-primary" onclick="handleSearchById('${carProfileId}', 'New Event Recorded Successfully!')">
                    👁️ View Updated Timeline
                  </button>
                  <button type="button" class="btn-secondary" onclick="resetEventForm('${carProfileId}')">
                    ➕ Add Another Event
                  </button>
                </div>
              </div>
            `;
            successContainer.scrollIntoView({ behavior: 'smooth' });
          }
        } else {
          alert('Error saving event: ' + ((res && res.error) || 'Unknown error'));
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        isSubmitting = false;
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = 'Save Event'; }
        alert('Server Error: ' + err.message);
      })
      .apiSaveEvent({ carProfileId, event: eventPayload, media: mediaFiles });
  }

  function handleSearch() {

          google.script.run

        <div class="detail-card"><div class="detail-card-title">Health Condition</div><div class="detail-card-value">${b.healthStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Vaccination</div><div class="detail-card-value">${b.vaccinationStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Sterilisation</div><div class="detail-card-value">${b.sterilisationStatus || 'Unknown'}</div></div>
        <div class="detail-card"><div class="detail-card-title">Identification Marks</div><div class="detail-card-value">${b.identificationMarks || 'None'}</div></div>

              <span style="font-size:12px; background:#fef3c7; color:#b45309; padding:2px 8px; border-radius:10px;">${hold.matchedCarProfileId}</span>
            </div>

            ${mPhotoUrl ? `<img src="${mPhotoUrl}" class="comp-photo-preview" />` : '<div style="height:120px; background:#e2e8f0; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#64748b; margin-bottom:14px;">No Photo in Record</div>'}

            <div class="comp-field-row"><div class="comp-label">Animal Name:</div><div class="comp-value"><strong>${mAnimal.animalName || 'Unknown'}</strong></div></div>
            <div class="comp-field-row"><div class="comp-label">CAR Profile ID:</div><div class="comp-value"><strong>${hold.matchedCarProfileId}</strong></div></div>
            <div class="comp-field-row"><div class="comp-label">Species / Type:</div><div class="comp-value">${mAnimal.animalType || 'Dog'}</div></div>
            <div class="comp-field-row"><div class="comp-label">Sex / Gender:</div><div class="comp-value">${mAnimal.sex || 'Unknown'}</div></div>
            <div class="comp-field-row"><div class="comp-label">Approx. Age:</div><div class="comp-value">${mAnimal.age || 'Unknown'}</div></div>
            <div class="comp-field-row"><div class="comp-label">Breed:</div><div class="comp-value">${mAnimal.breedType || mAnimal.nativeDogType || 'Indie'}</div></div>
            <div class="comp-field-row"><div class="comp-label">Area / Locality:</div><div class="comp-value"><strong>${mLoc.area || 'Unknown'}</strong></div></div>
            <div class="comp-field-row"><div class="comp-label">GPS Pin:</div><div class="comp-value">${mLoc.gpsCoordinates || 'None'}</div></div>
            <div class="comp-field-row"><div class="comp-label">Marks:</div><div class="comp-value">${mBase.identificationMarks || 'None'}</div></div>
            <div class="comp-field-row"><div class="comp-label">Health Status:</div><div class="comp-value">${mBase.healthStatus || 'Unknown'}</div></div>
            <div class="comp-field-row"><div class="comp-label">Events in History:</div><div class="comp-value">${matched.events ? matched.events.length : 0} event(s) recorded</div></div>
          </div>
        </div>
      `;
    }

    const modalFooter = document.getElementById('holdModalFooter');
    if (modalFooter) {
      modalFooter.innerHTML = `
        <button type="button" class="btn-primary" style="background:#137333;" onclick="resolveHold('${hold.holdId}', 'APPROVE')">
          ✅ Approve (Create New Profile)
        </button>
        <button type="button" class="btn-secondary" style="background:#e8f0fe; color:#1a73e8; border-color:#dadce0;" onclick="resolveHold('${hold.holdId}', 'CONFIRM_SAME')">
          🔗 Confirm Same (Merge with ${hold.matchedCarProfileId})
        </button>
        <button type="button" class="btn-secondary" style="background:#fce8e6; color:#c5221f; border-color:#fad2cf;" onclick="resolveHold('${hold.holdId}', 'REJECT')">
          ❌ Reject (Duplicate)
        </button>
        <button type="button" class="btn-secondary" onclick="closeHoldComparisonModal()">
          Close
        </button>
      `;
    }

    const modal = document.getElementById('holdComparisonModal');
    if (modal) modal.style.display = 'flex';
  }

  function closeHoldComparisonModal() {
    const modal = document.getElementById('holdComparisonModal');
    if (modal) modal.style.display = 'none';
  }

  function resolveHold(holdId, action) {
    const label = action === 'APPROVE' ? 'APPROVE and create a new animal profile' : action === 'CONFIRM_SAME' ? 'CONFIRM as the SAME animal and merge' : 'REJECT as duplicate';
    if (!confirm(`Are you sure you want to ${label} for Hold ID ${holdId}?`)) return;

    showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        showLoading(false);
        if (res && res.success) {
          alert('✅ Hold resolved successfully: ' + res.status);
          closeHoldComparisonModal();
          loadAdminHolds();
        } else {
          alert('Error resolving hold: ' + ((res && res.error) || 'Unknown error'));
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        alert('Server Error: ' + err.message);
      })
      .apiResolveHold(holdId, action, '');
  }

  // --- 10. Utility Helpers -----------------------------------------------------
  function copyToClipboard(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        alert('📋 Copied to clipboard: ' + text);
      }).catch(() => {
        prompt('Copy this ID:', text);
      });
    } else {
      prompt('Copy this ID:', text);
    }
  }

  function resetCreateForm() {
    const sbcContainer = document.querySelector('.sbc-container');
    if (sbcContainer) {
      sbcContainer.querySelectorAll('input').forEach(i => i.value = '');
      sbcContainer.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    }
    const successContainer = document.getElementById('profileSuccessContainer');
    if (successContainer) successContainer.innerHTML = '';
    const resultsContainer = document.getElementById('searchBeforeCreateResults');
    if (resultsContainer) resultsContainer.style.display = 'none';
    const previewEl = document.getElementById('sbcPhotoPreview');
    if (previewEl) previewEl.innerHTML = '';
    sbcUploadedFiles = [];
    uploadedFiles = [];
    showPage('create');
  }

  function resetEventForm(carProfileId) {
    const form = document.getElementById('eventForm');
    if (form) form.reset();
    const successContainer = document.getElementById('eventSuccessContainer');
    if (successContainer) successContainer.innerHTML = '';
    eventUploadedFiles = [];
    sterilizationUploadedFiles = [];
    if (carProfileId) {
      document.getElementById('eventCarProfileId').value = carProfileId;
    }
    switchEventTab('Vaccination or Preventive Care');
  }

  function closeMatchModal() {
    const modal = document.getElementById('matchResultsModal');
    if (modal) modal.style.display = 'none';
  }

  // --- 11. Explicit Window Bindings (for Google Apps Script HTML iframe sandbox) -
  window.showPage = showPage;
  window.getSbcGPSLocation = getSbcGPSLocation;
  window.getContributorGPSLocation = getContributorGPSLocation;
  window.getEventGPSLocation = getEventGPSLocation;
  window.captureGPS = captureGPS;
  window.getDirectDriveImageUrl = getDirectDriveImageUrl;
  window.handleSbcAnimalTypeChange = handleSbcAnimalTypeChange;
  window.handleSbcBreedTypeChange = handleSbcBreedTypeChange;
  window.handleSbcPhotoSelect = handleSbcPhotoSelect;
  window.handleSearchBeforeCreate = handleSearchBeforeCreate;
  window.handleDirectCreateFromSbc = handleDirectCreateFromSbc;
  window.autoFillProfileFormFromSbc = autoFillProfileFormFromSbc;
  window.selectSameAnimal = selectSameAnimal;
  window.selectDifferentAnimal = selectDifferentAnimal;
  window.selectNotSure = selectNotSure;
  window.closeMatchModal = closeMatchModal;
  window.handleAnimalTypeChange = handleAnimalTypeChange;
  window.handleNativeBreedChange = handleNativeBreedChange;
  window.handleBreedTypeChange = handleBreedTypeChange;
  window.handleCaregiverChange = handleCaregiverChange;
  window.handleCaregiverTypeChange = handleCaregiverTypeChange;
  window.handleCareTypeChange = handleCareTypeChange;
  window.handleFileSelect = handleFileSelect;
  window.handleEventFileSelect = handleEventFileSelect;
  window.handleSterilizationFileSelect = handleSterilizationFileSelect;
  window.handleProfileSubmit = handleProfileSubmit;
  window.handleEventSubmit = handleEventSubmit;
  window.switchEventTab = switchEventTab;
  window.handleSearch = handleSearch;
  window.handleSearchById = handleSearchById;
  window.renderProfileDisplay = renderProfileDisplay;
  window.loadSearchStats = loadSearchStats;
  window.loadProfiles = loadProfiles;
  window.loadAdminHolds = loadAdminHolds;
  window.viewHoldComparison = viewHoldComparison;
  window.closeHoldComparisonModal = closeHoldComparisonModal;
  window.resolveHold = resolveHold;
  window.copyToClipboard = copyToClipboard;
  window.resetCreateForm = resetCreateForm;
  window.resetEventForm = resetEventForm;

  // --- 12. App Initialization --------------------------------------------------
  function initApp() {
    switchEventTab('Vaccination or Preventive Care');

    const profileForm = document.getElementById('profileForm');
    if (profileForm) profileForm.addEventListener('submit', handleProfileSubmit);

    const eventForm = document.getElementById('eventForm');
    if (eventForm) eventForm.addEventListener('submit', handleEventSubmit);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
</script>
