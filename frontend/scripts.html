  function renderDetailedEventField(kind, field) {
    if (['animal_type', 'animal_name', 'car_profile_id', 'area_locality', 'nearest_landmark', 'google_location_pin', 'vaccinated', 'sterilized', 'identification_marks', 'identification_marks_other_details', 'identification_other_details'].includes(field[0])) return '';
    const slug = kind.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const name = `detail-${slug}-${field[0]}`;
    const label = escapeHtml(field[1]);
    const type = field[2];
    const conditional = /(^|_)(other|other_details)$/.test(field[0]) || field[0].includes('_other_') || field[0].endsWith('_other');
    const wrapperClass = conditional ? ' conditional-detail-field' : '';
    if (type === 'select') {
      return `<div class="form-group${wrapperClass}" data-detail-field="${field[0]}" style="${conditional ? 'display:none;' : ''}"><label>${label}</label><select name="${name}" onchange="updateConditionalDetailFields()"><option value="">Choose</option>${field[3].map(option => `<option>${escapeHtml(option)}</option>`).join('')}</select></div>`;
    }
    if (type === 'checks') {
      const exclusive = field[0] === 'further_support_needed' ? ' data-exclusive="No Further Support Needed"' : '';
      return `<div class="form-group${wrapperClass}" data-detail-field="${field[0]}" style="${conditional ? 'display:none;' : ''}"><label>${label}</label><div class="checkbox-group">${field[3].map(option => `<label><input type="checkbox" name="${name}" value="${escapeHtml(option)}"${exclusive} onchange="handleExclusiveSupport(event); updateConditionalDetailFields();"> ${escapeHtml(option)}</label>`).join('')}</div></div>`;
    }
    if (type === 'textarea') {
      return `<div class="form-group${wrapperClass}" data-detail-field="${field[0]}" style="${conditional ? 'display:none;' : ''}"><label>${label}</label><textarea name="${name}" rows="3"></textarea></div>`;
    }
    return `<div class="form-group${wrapperClass}" data-detail-field="${field[0]}" style="${conditional ? 'display:none;' : ''}"><label>${label}</label><input type="${type}" name="${name}"></div>`;
  }

  function updateConditionalDetailFields() {
    document.querySelectorAll('.conditional-detail-field').forEach(field => {
      const fieldId = field.dataset.detailField || '';
      const parentId = fieldId
        .replace(/_other_details$/, '')
        .replace(/_other$/, '')
        .replace(/_other_.*$/, '');
      const panel = field.closest('.event-detail-panel');
      if (!panel) return;
      const slug = panel.dataset.eventPanel.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const parentName = `detail-${slug}-${parentId}`;
      const parentInputs = panel.querySelectorAll(`[name="${parentName}"]`);
      const active = Array.from(parentInputs).some(input => input.checked || String(input.value).toLowerCase() === 'other');
      field.style.display = active ? '' : 'none';
      field.querySelectorAll('input, textarea, select').forEach(input => { input.required = active; input.disabled = !active; });
    });
  }

  function isRemovedEventField(fieldName) {
    return /^(date_reported|current_health_condition|behaviour|vaccinated|sterilized|identification_marks)/i.test(fieldName);
  }

  function handleExclusiveSupport(event) {
    if (!event.target.checked || event.target.dataset.exclusive !== 'No Further Support Needed') return;
    const group = event.target.name;
    document.querySelectorAll(`input[name="${group}"]`).forEach(input => {
      if (input !== event.target) input.checked = false;
    });
  }

    google.script.run.withSuccessHandler((result) => {

  function getSbcGPSLocation() {

  }

  function captureGPS(coordInputId, latInputId, lngInputId, methodInputId, statusDisplayId) {
    const coordInput = document.getElementById(coordInputId);
    const latInput = latInputId ? document.getElementById(latInputId) : null;
    const lngInput = lngInputId ? document.getElementById(lngInputId) : null;
    const methodInput = methodInputId ? document.getElementById(methodInputId) : null;
    const statusEl = statusDisplayId ? document.getElementById(statusDisplayId) : null;

    if (!navigator.geolocation) {
      alert('Geolocation is not supported by your browser. Please enter latitude, longitude manually.');
      return;
    }

    if (coordInput) coordInput.placeholder = 'GPS: Requesting location...';
    if (statusEl) statusEl.innerHTML = '<span style="color:#2D7A5F;">📍 Requesting location permission...</span>';

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = Math.round(position.coords.accuracy);

        if (coordInput) coordInput.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        if (latInput) latInput.value = lat;
        if (lngInput) lngInput.value = lng;
        if (methodInput) methodInput.value = 'Device GPS';
        if (statusEl) {
          statusEl.innerHTML = `<span style="color:#137333; font-weight:600;">✅ GPS Captured: ${lat.toFixed(5)}, ${lng.toFixed(5)} (+/-${accuracy}m)</span>`;
        }
      },
      (error) => {
        console.warn('GPS error:', error.message);
        if (coordInput) coordInput.placeholder = 'Latitude, Longitude (e.g. 17.38504, 78.48667)';
        if (methodInput) methodInput.value = 'Manual Entry';
        if (statusEl) {
          statusEl.innerHTML = '<span style="color:#c5221f;">⚠️ Could not get device GPS: ' + error.message + '. Please enter coordinates manually.</span>';
        }
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  }

  // --- 3. Image URL Resolution --------------------------------------------------
  function getDirectDriveImageUrl(fileIdOrUrl) {
    if (!fileIdOrUrl) return '';
    const str = String(fileIdOrUrl).trim();
    if (str.startsWith('data:image')) return str;
    let fileId = str;
    if (str.includes('id=')) {
      fileId = str.split('id=')[1].split('&')[0];
    } else if (str.includes('/d/')) {
      fileId = str.split('/d/')[1].split('/')[0];
    }
    if (/^[a-zA-Z0-9_-]{20,}$/.test(fileId)) {
      return 'https://lh3.googleusercontent.com/d/' + fileId;
    }
    return str;
  }

  function handleSbcPhotoSelect(event) {
    const files = Array.from(event.target.files);
    const previewEl = document.getElementById('sbcPhotoPreview');
    if (previewEl) previewEl.innerHTML = '';
    sbcUploadedFiles = [];

    for (const file of files) {

        const base64Data = e.target.result;
        sbcUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data, visibility: 'Restricted', source: 'Self-reported' });
        if (previewEl) {
          previewEl.innerHTML += `

              <div style="font-size:11px; color:#555; max-width:80px; overflow:hidden; text-overflow:ellipsis;">${file.name}</div>
            </div>
          `;
        }
      };
      reader.readAsDataURL(file);
    }

  function handleSearchBeforeCreate() {
    // Hide previous success or result containers
    const successContainer = document.getElementById('profileSuccessContainer');
    if (successContainer) successContainer.innerHTML = '';

    const name = document.getElementById('sbcContributorName')?.value?.trim();
    const mobile = document.getElementById('sbcContributorMobile')?.value?.trim();
    const animalType = document.getElementById('sbcAnimalType')?.value?.trim();
    const sex = document.getElementById('sbcSex')?.value?.trim();
    const age = document.getElementById('sbcAge')?.value?.trim();
    const breedType = document.getElementById('sbcBreedType')?.value?.trim();
    const area = document.getElementById('sbcArea')?.value?.trim();
    const gps = document.getElementById('sbcGpsCoordinates')?.value?.trim();
    const health = document.getElementById('sbcHealthStatus')?.value?.trim();
    const behavior = document.getElementById('sbcBehavior')?.value?.trim();
    const marks = document.getElementById('sbcIdentificationMarks')?.value?.trim();
    const animalName = document.getElementById('sbcAnimalName')?.value?.trim();

    // Validation checks for mandatory fields
    if (!name || name.length < 2) {
      alert('Please enter your name (Contributor Name, minimum 2 characters).');
      document.getElementById('sbcContributorName')?.focus();
      return;
    }
    if (!mobile || !/^[0-9]{10}$|^[0-9]{12}$/.test(mobile.replace(/[\s\-+]/g, ''))) {
      alert('Please enter a valid 10-digit mobile number.');
      document.getElementById('sbcContributorMobile')?.focus();
      return;
    }
    if (!animalType) {
      alert('Please select Animal Type.');
      document.getElementById('sbcAnimalType')?.focus();
      return;
    }
    if (!sex) {
      alert('Please select Gender / Sex.');
      document.getElementById('sbcSex')?.focus();
      return;
    }
    if (!age) {
      alert('Please select Approximate Age.');
      document.getElementById('sbcAge')?.focus();
      return;
    }
    if (!breedType) {
      alert('Please select Breed Type.');
      document.getElementById('sbcBreedType')?.focus();
      return;
    }
    if (!marks) {
      alert('Please enter Identification Marks or description.');
      document.getElementById('sbcIdentificationMarks')?.focus();
      return;
    }
    if (!area) {
      alert('Please enter Area / Locality.');
      document.getElementById('sbcArea')?.focus();
      return;
    }
    if (!gps) {
      alert('GPS Location is mandatory. Please click "📍 Capture Location" or enter coordinates manually.');

    google.script.run
      .withSuccessHandler((response) => {

          const errMsg = (response && response.error) ? response.error : 'Search failed or returned empty response.';

  function autoFillProfileFormFromSbc() {
    const setVal = (name, val) => {
      if (!val) return;
      const el = document.querySelector(`[name="${name}"]`);
      if (el) el.value = val;
    };

    setVal('contributorName', document.getElementById('sbcContributorName')?.value);

  function handleFileSelect(event) {
    const files = Array.from(event.target.files);
    uploadedFiles = [];
    const fileListEl = document.getElementById('fileList');
    if (fileListEl) fileListEl.innerHTML = '';

    for (const file of files) {
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data: e.target.result, visibility: 'Restricted', source: 'Self-reported' });
        if (fileListEl) fileListEl.innerHTML += `<div>Uploaded: ${file.name}</div>`;
      };
      reader.readAsDataURL(file);
    }
  }

  function handleEventFileSelect(event) {
    const files = Array.from(event.target.files);
    const maxFiles = Number(event.target.dataset.maxFiles || 5);
    if (files.length > maxFiles) {
      alert(`Upload a maximum of ${maxFiles} file${maxFiles === 1 ? '' : 's'}.`);
      event.target.value = '';
      return;
    }
    eventUploadedFiles = [];
    const listEl = event.target.parentElement ? event.target.parentElement.querySelector('.file-list') : null;
    if (listEl) listEl.innerHTML = '';

    for (const file of files) {
      if (file.size > 10 * 1024 * 1024) {
        alert(file.name + ' exceeds the 10 MB limit.');
        continue;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        eventUploadedFiles.push({ filename: file.name, mimeType: file.type, base64Data: e.target.result, visibility: 'Restricted', source: 'Self-reported' });
        if (listEl) listEl.innerHTML += `<div>Attached: ${file.name}</div>`;
      };
      reader.readAsDataURL(file);
    }
  }

  function switchEventTab(kind) {
    const typeInput = document.getElementById('eventType');
    if (typeInput) typeInput.value = kind;
    const submitButton = document.querySelector('#eventForm button[type="submit"]');
    if (submitButton) {
      const submitLabels = {
        'Vaccination or Preventive Care': 'Submit',
        'Relocation': 'Submit Relocation Event',
        'Cruelty / Abuse': 'Submit Cruelty / Abuse Report',
        'Returned / Released': 'Submit Return / Release Event',
        'Bite Incident Report': 'Submit Bite Incident Report',
        'Foster Care': 'Submit Foster Care Event',
        'Picked Up by Agencies / Government Bodies': 'Submit Pick-up Event',
        'Community Conflict': 'Submit Community Conflict Report',
        'Death': 'Submit Death Report',
        'Other Events Not Listed': 'Submit Other Event'
      };
      submitButton.textContent = submitLabels[kind] || 'Save Event';
    }

    // Update button active styling
    const buttons = document.querySelectorAll('.event-kind-button');
    buttons.forEach(btn => {
      const isMatch = (btn.dataset.eventKind === kind) || (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(kind));
      if (isMatch) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // Toggle panel visibility and dynamically enable/disable inputs
    // (Disabled inputs are excluded from HTML5 browser validation, preventing "element not focusable" errors)
    document.querySelectorAll('.event-detail-panel').forEach(panel => {
      const isActive = panel.dataset.eventPanel === kind;
      panel.style.display = isActive ? 'block' : 'none';
      panel.querySelectorAll('input, select, textarea').forEach(input => {
        input.disabled = !isActive;
      });
    });
  }

  function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = value === null || value === undefined ? '' : String(value);
    return element.innerHTML;
  }

  function decodeEditValue(value) {
    try { return decodeURIComponent(value || ''); } catch (error) { return value || ''; }
  }

  function encodeEditValue(value) {
    return encodeURIComponent(value === null || value === undefined ? '' : String(value)).replace(/'/g, '%27');
  }

  let activeRegistryEdit = null;

  function setRegistryField(form, name, value) {
    const controls = Array.from(form.querySelectorAll(`[name="${name}"]`));
    if (!controls.length) return;
    let normalizedValue = value === null || value === undefined ? '' : String(value);
    if (controls[0].type === 'checkbox') {
      const selected = normalizedValue.split(',').map(item => item.trim());
      controls.forEach(control => { control.checked = selected.includes(control.value); });
      return;
    }
    const control = controls[0];
    if (control.type === 'date' && normalizedValue) {
      const isoDate = normalizedValue.match(/^\d{4}-\d{2}-\d{2}/);
      if (isoDate) normalizedValue = isoDate[0];
    }
    if (control.tagName === 'SELECT' && normalizedValue && !Array.from(control.options).some(option => option.value === normalizedValue)) {
      control.add(new Option(normalizedValue, normalizedValue));
    }
    control.value = normalizedValue;
    control.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function readRegistryFields(form, fieldNames) {
    const result = {};
    fieldNames.forEach(name => {
      const controls = Array.from(form.querySelectorAll(`[name="${name}"]`));
      if (!controls.length) return;
      if (controls[0].type === 'checkbox') result[name] = controls.filter(control => control.checked).map(control => control.value).join(', ');
      else result[name] = controls[0].value.trim();
    });
    return result;
  }

  function submitEditCorrections(form, messageId, targetTable, targetRecordId, carProfileId, snapshotKey) {
    const formData = new FormData(form);
    const message = document.getElementById(messageId);
    const edits = Array.from(form.querySelectorAll('[data-edit-field]')).map(input => ({
      fieldName: input.dataset.editField,
      oldValue: activeEditSnapshots[snapshotKey][input.dataset.editField] || '',
      newValue: input.value.trim()
    })).filter(edit => edit.oldValue !== edit.newValue);
    if (!edits.length) {
      if (message) { message.className = 'form-message error'; message.textContent = 'Change at least one value before saving.'; }
      return;
    }
    const submitButton = form.querySelector('button[type="submit"]');
    if (submitButton) submitButton.disabled = true;
    if (message) { message.className = 'form-message'; message.textContent = 'Recording edit...'; }
    let editIndex = 0;
    const saveNextEdit = () => {
      if (editIndex >= edits.length) {
        if (submitButton) submitButton.disabled = false;
        if (message) { message.className = 'form-message success'; message.textContent = 'Edit recorded successfully.'; }
        setTimeout(() => handleSearchById(carProfileId, 'Edit recorded successfully.'), 300);
        return;
      }
      const edit = edits[editIndex++];
      google.script.run
        .withSuccessHandler((response) => {
          if (!response || !response.success) {
            if (submitButton) submitButton.disabled = false;
            if (message) { message.className = 'form-message error'; message.textContent = (response && response.error) || 'Unable to record edit.'; }
            return;
          }
          saveNextEdit();
        })
        .withFailureHandler((error) => {
          if (submitButton) submitButton.disabled = false;
          if (message) { message.className = 'form-message error'; message.textContent = 'Server Error: ' + error.message; }
        })
        .apiLogCorrection(targetTable, targetRecordId, canonicalEditField(edit.fieldName), edit.oldValue, edit.newValue, formData.get('reason'), '', carProfileId);
    };
    saveNextEdit();
  }

  function submitRegistryFormEdits(form, editState) {

      fieldName: fieldName,
      oldValue: editState.snapshot[fieldName] || '',

      alert('Change at least one registry field before saving.');
      return;
    }
    const submitButton = form.querySelector('button[type="submit"]');
    if (submitButton) submitButton.disabled = true;
    let editIndex = 0;
    const saveNext = () => {
      if (editIndex >= edits.length) {
        if (submitButton) submitButton.disabled = false;
        activeRegistryEdit = null;
        handleSearchById(editState.carProfileId, 'Registry changes saved successfully.');
        return;

  // --- 9. Admin Hold Queue & Side-by-Side Review --------------------------------
  function loadAdminHolds() {
    const container = document.getElementById('adminHoldList');
    if (!container) return;
    container.innerHTML = '<p style="color:#2D7A5F; font-weight:600;">Loading pending verification holds...</p>';

    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.success) {
          container.innerHTML = '<p class="form-message error">Failed to load holds: ' + ((res && res.error) || 'Unknown error') + '</p>';
          return;
        }
        if (!res.holds || res.holds.length === 0) {
          container.innerHTML = '<p style="color:#137333; padding:18px; background:#e6f4ea; border-radius:8px; font-weight:600;">✅ No pending holds. All submissions have been reviewed.</p>';
          cachedPendingHolds = [];
          return;
        }

        cachedPendingHolds = res.holds;
        let html = '';

        res.holds.forEach(h => {
          const submitted = h.submittedData || {};
          const animal = submitted.animal || {};
          const location = submitted.location || {};
          const matched = h.matchedProfile || {};
          const matchedAnimal = matched.animal || {};

          const submittedDogName = animal.animalName || 'Unnamed Submitted Animal';
          const matchedDogName = matchedAnimal.animalName || 'Existing Record';

          html += `
            <div class="admin-hold-card">
              <div class="admin-hold-header">
                <div>
                  <span class="profile-car-id" style="margin-right:8px;">${h.holdId}</span>
                  <span class="match-score-badge" style="background:#f59e0b; color:#fff; padding:3px 8px; border-radius:4px; font-weight:700; font-size:12px;">${h.matchScore}% Match Score</span>
                </div>
                <div>
                  <button type="button" class="btn-eye" onclick="viewHoldComparison('${h.holdId}')">
                    👁️ View Side-by-Side Comparison
                  </button>
                </div>
              </div>

              <div class="dual-dog-names" style="margin-bottom:12px;">
                <span class="dog-tag-submitted">🐾 Submitted: ${submittedDogName}</span>
                <span class="vs-badge">VS</span>
                <span class="dog-tag-matched">🐾 Matched: ${matchedDogName} (${h.matchedCarProfileId})</span>
              </div>

              <div style="font-size:14px; color:#555; margin-bottom:16px;">
                <strong>Area:</strong> ${location.area || 'Unknown'} &bull;
                <strong>Type:</strong> ${animal.animalType || 'Dog'} &bull;
                <strong>Submitted:</strong> ${h.createdAt || 'Recent'}
              </div>

              <div style="display:flex; gap:10px; flex-wrap:wrap; padding-top:10px; border-top:1px solid #f1f5f9;">
                <button type="button" class="btn-primary" style="background:#137333;" onclick="resolveHold('${h.holdId}', 'APPROVE')">
                  ✅ Approve (Create New Profile)
                </button>
                <button type="button" class="btn-secondary" style="background:#e8f0fe; color:#1a73e8; border-color:#dadce0;" onclick="resolveHold('${h.holdId}', 'CONFIRM_SAME')">
                  🔗 Confirm Same (Merge)
                </button>
                <button type="button" class="btn-secondary" style="background:#fce8e6; color:#c5221f; border-color:#fad2cf;" onclick="resolveHold('${h.holdId}', 'REJECT')">
                  ❌ Reject (Duplicate)
                </button>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      })
      .withFailureHandler((err) => {
        container.innerHTML = '<p class="form-message error">Error loading holds: ' + err.message + '</p>';
      })
      .apiGetPendingHolds();
  }

            <div class="comp-field-row"><div class="comp-label">Sex / Gender:</div><div class="comp-value">${mAnimal.sex || 'Unknown'}</div></div>

  function closeHoldComparisonModal() {
    const modal = document.getElementById('holdComparisonModal');
    if (modal) modal.style.display = 'none';
  }

  function resolveHold(holdId, action) {
    const label = action === 'APPROVE' ? 'APPROVE and create a new animal profile' : action === 'CONFIRM_SAME' ? 'CONFIRM as the SAME animal and merge' : 'REJECT as duplicate';
    if (!confirm(`Are you sure you want to ${label} for Hold ID ${holdId}?`)) return;

    showLoading(true);
    google.script.run
      .withSuccessHandler((res) => {
        showLoading(false);
        if (res && res.success) {
          alert('✅ Hold resolved successfully: ' + res.status);
          closeHoldComparisonModal();
          loadAdminHolds();
        } else {
          alert('Error resolving hold: ' + ((res && res.error) || 'Unknown error'));
        }
      })
      .withFailureHandler((err) => {
        showLoading(false);
        alert('Server Error: ' + err.message);
      })
      .apiResolveHold(holdId, action, '');
  }

  // --- 10. Utility Helpers -----------------------------------------------------
  function copyToClipboard(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        alert('📋 Copied to clipboard: ' + text);
      }).catch(() => {
        prompt('Copy this ID:', text);
      });
    } else {
      prompt('Copy this ID:', text);
    }
  }

  function resetCreateForm() {
    const sbcContainer = document.querySelector('.sbc-container');
    if (sbcContainer) sbcContainer.style.display = '';
    if (sbcContainer) {
      sbcContainer.querySelectorAll('input').forEach(i => i.value = '');
      sbcContainer.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    }
    const successContainer = document.getElementById('profileSuccessContainer');
    if (successContainer) successContainer.innerHTML = '';
    const resultsContainer = document.getElementById('searchBeforeCreateResults');
    if (resultsContainer) resultsContainer.style.display = 'none';
    const previewEl = document.getElementById('sbcPhotoPreview');
    if (previewEl) previewEl.innerHTML = '';
    sbcUploadedFiles = [];
    uploadedFiles = [];
    activeRegistryEdit = null;
    const contributorSection = document.getElementById('profileContributorSection');
    if (contributorSection) {
      contributorSection.style.display = '';
      contributorSection.querySelectorAll('input, select, textarea').forEach(field => { field.disabled = false; });
    }
    const pageTitle = document.getElementById('createPageTitle');
    const pageSubtitle = document.getElementById('createPageSubtitle');
    if (pageTitle) pageTitle.textContent = 'Add to CAR';
    if (pageSubtitle) pageSubtitle.textContent = 'Ready to create a profile? Create an animal profile for someone you take care of or know of.';
    const profileSubmit = document.querySelector('#profileForm button[type="submit"]');
    if (profileSubmit) profileSubmit.textContent = 'Create Profile';
    showPage('create');
  }

    const form = document.getElementById('eventForm');

    const successContainer = document.getElementById('eventSuccessContainer');
    if (successContainer) successContainer.innerHTML = '';

  // --- 12. App Initialization --------------------------------------------------
  function initApp() {
    ensureAdditionalEventQuestionnaires();
    updateAdminNavigation();
    const adminLoginForm = document.getElementById('adminLoginForm');
    if (adminLoginForm) adminLoginForm.addEventListener('submit', handleAdminLogin);
    switchEventTab('Vaccination or Preventive Care');

    // Profile and event forms use their inline onsubmit handlers.
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }

  // ── Phase 3: Dashboard View (W3.1 / W3.8) ──────────────────────────────────

  /**
   * loadDashboard()
   * Calls apiGetDashboardStats() and renders all stat cards, species chips,
   * and recent events table. Invoked automatically by showPage('dashboard').
   */
  function loadDashboard() {
    var btn = document.getElementById('dashRefreshBtn');
    var loadingEl = document.getElementById('dashLoadingState');
    if (btn) btn.disabled = true;
    if (loadingEl) loadingEl.style.display = 'block';

    google.script.run
      .withSuccessHandler(function(result) {
        if (btn) btn.disabled = false;
        if (loadingEl) loadingEl.style.display = 'none';
        if (!result || !result.success) {
          console.error('Dashboard load failed:', result && result.error);
          return;
        }
        renderDashboardStats(result);
      })
      .withFailureHandler(function(err) {
        if (btn) btn.disabled = false;
        if (loadingEl) loadingEl.style.display = 'none';
        console.error('Dashboard API error:', err);
      })
      .apiGetDashboardStats();
  }

  /**
   * refreshDashboard()
   * Re-fetches live stats on button click.
   */
  function refreshDashboard() {
    loadDashboard();
  }

  /**
   * renderDashboardStats(data)
   * Populates all dashboard DOM elements from the API response.
   * @param {Object} data - Response from apiGetDashboardStats()
   */
  function renderDashboardStats(data) {
    function setVal(id, val) {
      var el = document.getElementById(id);
      if (el) el.textContent = (val !== undefined && val !== null) ? String(val) : '0';
    }

    // 8 stat cards
    setVal('dashTotalProfiles',    data.totalProfiles);
    setVal('dashTotalEvents',      data.totalEvents);
    setVal('dashVaccinated',       data.vaccinated);
    setVal('dashSterilised',       data.sterilised);
    setVal('dashHealthy',          data.healthy);
    setVal('dashUnderTreatment',   data.underTreatment);
    setVal('dashCommunityReports', data.communityReports);
    setVal('dashReviewQueue',      data.reviewQueue);

    // Species breakdown chips
    var sp = data.speciesBreakdown || {};
    setVal('dashDog',   sp.Dog   !== undefined ? sp.Dog   : 0);
    setVal('dashCat',   sp.Cat   !== undefined ? sp.Cat   : 0);
    setVal('dashCow',   sp.Cow   !== undefined ? sp.Cow   : 0);
    setVal('dashBird',  sp.Bird  !== undefined ? sp.Bird  : 0);
    setVal('dashOther', sp.Other !== undefined ? sp.Other : 0);

    // Recent events table
    var container = document.getElementById('dashRecentEventsContainer');
    if (!container) return;

    var events = data.recentEvents || [];
    if (!events.length) {
      container.innerHTML = '<div class="dash-empty-state">No events recorded yet.</div>';
      return;
    }

    var rows = events.map(function(e) {
      var date    = e.dateOfEvent || (e.timestamp ? String(e.timestamp).slice(0, 10) : '—');
      var carId   = e.carProfileId || '';
      var idPill  = carId
        ? '<span class="dash-car-id-pill" style="cursor:pointer;" onclick="loadProfileFromDashboard(\'' + escapeHtml(carId) + '\')">' + escapeHtml(carId) + '</span>'
        : '—';
      var typePill = '<span class="dash-event-type-pill">' + escapeHtml(e.eventType || '—') + '</span>';
      return '<tr style="cursor:pointer;" onclick="loadProfileFromDashboard(\'' + escapeHtml(carId) + '\')">' +
        '<td>' + idPill + '</td>' +
        '<td>' + escapeHtml(e.animalName || '—') +
          '<span style="color:var(--text-light);font-size:12px;margin-left:4px;">(' + escapeHtml(e.animalType || '') + ')</span></td>' +
        '<td>' + typePill + '</td>' +
        '<td>' + escapeHtml(date) + '</td>' +
        '<td>' + escapeHtml(e.area || '—') + '</td>' +
        '<td>' + escapeHtml(e.outcomeCurrentStatus || '—') + '</td>' +
        '</tr>';
    }).join('');

    container.innerHTML =
      '<table class="recent-events-table">' +
        '<thead><tr>' +
          '<th>CAR ID</th><th>Animal</th><th>Event Type</th>' +
          '<th>Date</th><th>Area</th><th>Outcome / Status</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  /**
   * loadProfileFromDashboard(carProfileId)
   * Navigates from the Dashboard recent events row to that animal's profile page.
   */
  function loadProfileFromDashboard(carProfileId) {
    if (!carProfileId) return;
    showLoading();
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        if (result && result.success && result.found) {
          renderProfileDisplay(result.profile);
          showPage('profile');
        } else {
          showPage('search');
        }
      })
      .withFailureHandler(function() {
        hideLoading();
        showPage('search');
      })
      .apiSearchProfile(carProfileId, false);
  }


  // ── Phase 4: Gallery View (W3.2) ──────────────────────────────────────────
  let cachedGalleryProfiles = [];

  /**
   * loadGallery()
   * Fetches profile card data via apiGetGalleryProfiles() and renders the gallery.
   */
  function loadGallery() {
    const grid = document.getElementById('galleryGrid');
    const btn = document.getElementById('galleryRefreshBtn');
    const countEl = document.getElementById('galleryCountDisplay');

    if (btn) btn.disabled = true;
    if (countEl) countEl.textContent = 'Loading animal profiles...';
    if (grid) {
      grid.innerHTML = '<div class="dash-loading" style="grid-column: 1 / -1;">Loading animal gallery...</div>';
    }

    google.script.run
      .withSuccessHandler(function(result) {
        if (btn) btn.disabled = false;
        if (!result || !result.success) {
          if (grid) grid.innerHTML = '<div class="dash-empty-state" style="grid-column: 1 / -1;">Could not load gallery: ' + escapeHtml(result && result.error ? result.error : 'Unknown error') + '</div>';
          if (countEl) countEl.textContent = 'Error loading profiles';
          return;
        }
        cachedGalleryProfiles = result.profiles || [];
        filterGallery();
      })
      .withFailureHandler(function(err) {
        if (btn) btn.disabled = false;
        if (grid) grid.innerHTML = '<div class="dash-empty-state" style="grid-column: 1 / -1;">Failed to load gallery profiles.</div>';
        if (countEl) countEl.textContent = 'Failed to load';
        console.error('Gallery error:', err);
      })
      .apiGetGalleryProfiles({});
  }

  /**
   * filterGallery()
   * Client-side filter on cachedGalleryProfiles based on search text, species, and status.
   */
  function filterGallery() {
    const searchInput = document.getElementById('gallerySearchInput');
    const speciesSelect = document.getElementById('gallerySpeciesFilter');
    const statusSelect = document.getElementById('galleryStatusFilter');
    const countEl = document.getElementById('galleryCountDisplay');

    const query = (searchInput ? searchInput.value : '').trim().toLowerCase();
    const species = (speciesSelect ? speciesSelect.value : '').trim().toLowerCase();
    const status = (statusSelect ? statusSelect.value : '').trim().toLowerCase();

    const filtered = cachedGalleryProfiles.filter(function(p) {
      // 1. Species filter
      if (species && (p.animalType || '').toLowerCase() !== species) {
        return false;
      }
      // 2. Status filter
      if (status) {
        const hs = (p.currentStatus || '').toLowerCase();
        if (status === 'healthy' && !hs.includes('healthy')) return false;
        if (status === 'under treatment' && (!hs.includes('treatment') && !hs.includes('sick') && !hs.includes('injured'))) return false;
      }
      // 3. Search query
      if (query) {
        const combined = `${p.carProfileId || ''} ${p.animalName || ''} ${p.animalType || ''} ${p.area || ''} ${p.city || ''} ${p.sex || ''}`.toLowerCase();
        if (!combined.includes(query)) return false;
      }
      return true;
    });

    if (countEl) {
      countEl.textContent = `Showing ${filtered.length} of ${cachedGalleryProfiles.length} animals`;
    }

    renderGalleryGrid(filtered);
  }

  /**
   * resetGalleryFilters()
   * Clears search and filter controls and re-filters.
   */
  function resetGalleryFilters() {
    const searchInput = document.getElementById('gallerySearchInput');
    const speciesSelect = document.getElementById('gallerySpeciesFilter');
    const statusSelect = document.getElementById('galleryStatusFilter');
    if (searchInput) searchInput.value = '';
    if (speciesSelect) speciesSelect.value = '';
    if (statusSelect) statusSelect.value = '';
    filterGallery();
  }

  /**
   * renderGalleryGrid(profiles)
   * Renders the cards into #galleryGrid.
   */
  function renderGalleryGrid(profiles) {
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;

    if (!profiles || profiles.length === 0) {
      grid.innerHTML = '<div class="dash-empty-state" style="grid-column: 1 / -1;">No animal profiles match your filters.<br><small style="margin-top:6px;display:inline-block;"><button type="button" class="btn-secondary" onclick="resetGalleryFilters()">Clear filters</button></small></div>';
      return;
    }

    const cardsHtml = profiles.map(function(p) {
      const carId = escapeHtml(p.carProfileId || '');
      const name = escapeHtml(p.animalName || 'Unnamed Animal');
      const type = escapeHtml(p.animalType || 'Animal');
      const area = escapeHtml(p.area || 'Locality Pending');
      const city = p.city ? ', ' + escapeHtml(p.city) : '';
      const sex = escapeHtml(p.sex || 'Unknown sex');
      const age = escapeHtml(p.age || 'Age unknown');
      const status = escapeHtml(p.currentStatus || 'Unknown');
      const eventCount = p.eventCount || 0;
      const initial = (p.animalName || '?').slice(0, 1).toUpperCase();

      // Badge style
      const sLower = status.toLowerCase();
      let badgeClass = 'badge-unknown';
      if (sLower.includes('healthy')) badgeClass = 'badge-healthy';
      else if (sLower.includes('treatment') || sLower.includes('sick') || sLower.includes('injured')) badgeClass = 'badge-treatment';

      const photoHtml = p.photoUrl
        ? `<img class="gallery-card-img" src="${p.photoUrl}" alt="${name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="gallery-card-placeholder" style="display:none;">${initial}</div>`
        : `<div class="gallery-card-placeholder">${initial}</div>`;

      return `
        <div class="gallery-card" onclick="openProfileFromGallery('${encodeEditValue(p.carProfileId)}')">
          <div class="gallery-card-img-wrap">
            ${photoHtml}
            <span class="gallery-card-species-badge">${type}</span>
            <span class="gallery-card-status-badge ${badgeClass}">${status}</span>
          </div>
          <div class="gallery-card-body">
            <div class="gallery-card-name">
              <span>${name}</span>
              <span class="dash-car-id-pill">${carId}</span>
            </div>
            <div class="gallery-card-meta">${sex} &bull; ${age}</div>
            <div class="gallery-card-loc">📍 ${area}${city}</div>
            <div class="gallery-card-footer">
              <span style="color:var(--text-light);font-size:12px;">
                ${p.vaccinationStatus ? '💉 ' + escapeHtml(p.vaccinationStatus) : ''}
              </span>
              <span class="gallery-event-count-pill">${eventCount} event${eventCount === 1 ? '' : 's'}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    grid.innerHTML = cardsHtml;
  }

  /**
   * openProfileFromGallery(encodedCarProfileId)
   * Navigates from Gallery to Profile view for the chosen animal.
   */
  function openProfileFromGallery(encodedCarProfileId) {
    const carProfileId = decodeEditValue(encodedCarProfileId);
    if (!carProfileId) return;
    handleSearchById(carProfileId);
  }

</script>
